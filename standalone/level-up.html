<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEVEL UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FFF1E8; --panel:#FFFFFF; --ink:#1D2B53; --ink-2:#5A6485; --line:#1D2B53; --soft:#F3E3D6;
  --red:#E0003F; --red-soft:#FFD9E2; --orange:#FFA300; --yellow:#FFEC27; --green:#008751; --green-soft:#D2F5DF;
  --blue:#29ADFF; --blue-deep:#0B5FA5; --purple:#7E2553; --met:#5F6B8C; --met-soft:#E4E7F0;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111827; --panel:#1D2B53; --ink:#FFF1E8; --ink-2:#C2C3D6; --line:#FFF1E8; --soft:#26366A;
    --red:#FF4D7A; --red-soft:#4A1330; --green:#00E436; --green-soft:#123D2A; --blue-deep:#29ADFF; --met:#C2C8DC; --met-soft:#2B3A6B;
  }
}
:root[data-theme="dark"]{
  --bg:#111827; --panel:#1D2B53; --ink:#FFF1E8; --ink-2:#C2C3D6; --line:#FFF1E8; --soft:#26366A;
  --red:#FF4D7A; --red-soft:#4A1330; --green:#00E436; --green-soft:#123D2A; --blue-deep:#29ADFF; --met:#C2C8DC; --met-soft:#2B3A6B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:8px 8px}
h1,h2,h3,.px{font-family:var(--pixel);font-weight:400;line-height:1.5;margin:0;letter-spacing:0}
p{margin:0 0 .8em}
a{color:var(--blue-deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.muted{color:var(--ink-2)} .small{font-size:.9rem}

/* Pixel frame: stepped corners, no radius */
.frame{background:var(--panel);position:relative;margin:4px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),8px 8px 0 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.pbtn{font-family:var(--pixel);font-size:.72rem;line-height:1.4;border:0;background:var(--ink);color:var(--bg);padding:12px 16px;cursor:pointer;margin:4px;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 color-mix(in srgb,#000 30%,transparent)}
.pbtn:hover{background:var(--blue-deep)}
.pbtn:active{transform:translateY(2px)}
.pbtn.alt{background:var(--panel);color:var(--ink);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 var(--soft)}
.pbtn.alt:hover{background:var(--soft)}
.pbtn.small{font-size:.62rem;padding:8px 10px}

header.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px clamp(16px,4vw,40px);max-width:920px;margin:0 auto;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:1rem;display:flex;gap:10px;align-items:center}
.brand .up{color:var(--red)}
.cobrand{font-family:var(--body);font-weight:700;font-size:.85rem;color:var(--ink-2);margin-left:4px}
main{max-width:920px;margin:0 auto;padding:8px clamp(16px,4vw,40px) 80px}

/* Start */
.title{font-size:clamp(2.2rem,8vw,4.4rem);margin:34px 0 8px;color:var(--ink);text-shadow:4px 4px 0 var(--orange),8px 8px 0 var(--red)}
.tag{font-size:1.15rem;color:var(--ink-2);max-width:54ch;margin:26px 0 0}
.cart{padding:30px 26px;text-align:center;margin:34px 4px 18px}
.cart.hover{background:var(--soft)}
.cart h2{font-size:.9rem;margin-bottom:12px}
.press{font-family:var(--pixel);font-size:.8rem;margin-top:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.status{margin-top:14px;font-weight:700} .status.err{color:var(--red)}

/* Player card */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:22px 24px;margin-top:14px}
.avatar{width:96px;height:112px;image-rendering:pixelated;background:var(--soft);padding:8px}
.p1{font-family:var(--pixel);font-size:.62rem;color:var(--red)}
.pname{font-size:clamp(1.3rem,4vw,1.9rem);margin:6px 0 4px}
.pclass{font-weight:700;color:var(--ink-2)}
.samplebadge{font-family:var(--pixel);font-size:.55rem;background:var(--yellow);color:#1D2B53;padding:3px 6px;margin-left:8px;vertical-align:middle}
.lv{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.lv .rank{font-family:var(--pixel);font-size:.72rem}
.xpbar{display:flex;gap:3px;height:16px;flex:1;min-width:160px;max-width:300px}
.xpbar i{flex:1;background:var(--soft)}
.xpbar i.on{background:var(--yellow);box-shadow:inset 0 -4px 0 var(--orange)}
.xptext{font-family:var(--pixel);font-size:.55rem;color:var(--ink-2);margin-top:6px}
.qblock{width:84px;height:84px;border:0;padding:0;cursor:pointer;background:var(--orange);position:relative;font-family:var(--pixel);font-size:2rem;color:#fff;text-shadow:3px 3px 0 #AB5236;
  box-shadow:inset 6px 6px 0 #FFD27A,inset -6px -6px 0 #AB5236,0 0 0 4px #1D2B53}
.qblock::before,.qblock::after{content:"";position:absolute;width:6px;height:6px;background:#1D2B53;top:8px;left:8px;box-shadow:62px 0 0 #1D2B53,0 62px 0 #1D2B53,62px 62px 0 #1D2B53}
.qblock::after{display:none}
.qblock.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{transform:translateY(-14px)}}
.qwrap{text-align:center}
.qwrap .px{font-size:.5rem;margin-top:10px;color:var(--ink-2)}
.coin{position:absolute;left:50%;top:-10px;width:18px;height:24px;background:var(--yellow);box-shadow:inset -4px 0 0 var(--orange),0 0 0 3px #1D2B53;transform:translateX(-50%);animation:coin .6s steps(6) forwards;pointer-events:none}
@keyframes coin{0%{transform:translate(-50%,0)}60%{transform:translate(-50%,-70px)}100%{transform:translate(-50%,-50px);opacity:0}}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
.stat{font-family:var(--pixel);font-size:.58rem;background:var(--panel);padding:8px 10px;box-shadow:0 0 0 3px var(--line)}
.stat b{font-weight:400;color:var(--blue-deep)}
.summary{font-size:1.1rem;margin-top:20px}

.quest-pop{margin-top:22px;padding:20px 22px;background:#1D2B53;color:#FFF1E8;display:none}
.quest-pop.show{display:block}
.quest-pop .px{font-size:.62rem;color:var(--yellow)}
.quest-pop p{font-size:1.1rem;margin:10px 0 6px}
.quest-pop .from{font-size:.88rem;opacity:.8;margin-bottom:12px}

/* World map */
.world{margin-top:30px;padding:20px 22px 16px;overflow-x:auto}
.world h2{font-size:.72rem;margin-bottom:6px}
.world-inner{position:relative;min-width:560px;padding:40px 10px 0}
.nodes{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.node > :first-child{height:56px;display:flex;align-items:flex-end;justify-content:center}
.node{display:flex;flex-direction:column;align-items:center;width:90px;text-align:center;cursor:default;background:none;border:0;padding:0}
button.node{cursor:pointer}
.tile{width:40px;height:40px;margin-top:16px;display:grid;place-content:center;font-family:var(--pixel);font-size:.7rem;background:var(--red);color:#fff;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),0 0 0 3px #1D2B53}
.node.clear .tile{background:var(--yellow);color:#1D2B53}
.node .nlab{font-size:.78rem;font-weight:700;margin-top:14px;line-height:1.25;min-height:2.5em}
.flagpole{width:40px;height:56px;position:relative}
.flagpole::before{content:"";position:absolute;left:18px;top:0;width:4px;height:56px;background:var(--ink)}
.flagpole::after{content:"";position:absolute;left:22px;top:2px;width:18px;height:12px;background:var(--green)}
.castle{width:56px;height:56px;image-rendering:pixelated}
.ground{position:absolute;left:0;right:0;top:90px;height:12px;background:repeating-linear-gradient(90deg,var(--green) 0 12px,color-mix(in srgb,var(--green) 70%,#000) 12px 24px)}
.sprite{position:absolute;top:56px;width:30px;height:36px;margin-left:-15px;z-index:2;transition:left .9s steps(9);image-rendering:pixelated}
.sprite svg{animation:hop .5s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-3px)}}

/* Sections */
section.group{margin-top:46px}
section.group > h2{font-size:.95rem;margin-bottom:10px}
section.group > p{color:var(--ink-2);margin-bottom:18px}

/* Boss cards */
.card{padding:24px 26px;margin:0 4px 26px}
.card-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.lvtag{font-family:var(--pixel);font-size:.58rem;color:var(--red)}
.card h3{font-family:var(--body);font-weight:700;font-size:1.4rem;line-height:1.25;margin-top:6px}
.kind{font-size:.85rem;color:var(--ink-2);font-weight:700}
.hp{min-width:170px}
.hp .px{font-size:.52rem;display:flex;justify-content:space-between}
.hpbar{display:flex;gap:3px;height:14px;margin-top:6px}
.hpbar i{flex:1;background:var(--red);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:background .2s}
.hpbar i.gone{background:var(--soft);box-shadow:none}
.card h4{font-family:var(--pixel);font-weight:400;font-size:.6rem;margin:22px 0 10px;color:var(--ink-2)}
.expect{margin:0;padding-left:20px}
.expect li{margin:4px 0}
.tip{background:var(--soft);padding:12px 16px;border-left:6px solid var(--blue)}
.tip.fade{opacity:0}
.tipbar{display:flex;gap:10px;align-items:center;margin-top:10px}
.quests{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.quest{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;cursor:pointer;background:var(--panel);box-shadow:0 0 0 3px var(--soft);position:relative}
.quest:hover{box-shadow:0 0 0 3px var(--blue)}
.quest input{appearance:none;flex:none;width:24px;height:24px;margin-top:1px;cursor:pointer;background:var(--panel);box-shadow:0 0 0 3px var(--ink);display:grid;place-content:center}
.quest input:checked{background:var(--green)}
.quest input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.quest .xpv{font-family:var(--pixel);font-size:.5rem;color:var(--orange);margin-left:auto;white-space:nowrap;padding-top:4px}
.quest.done{background:var(--green-soft);box-shadow:0 0 0 3px transparent}
.quest.done span.q{color:var(--ink-2);text-decoration:line-through}
.loot{margin-top:16px;font-size:.95rem}
.loot .px{font-size:.55rem;color:var(--purple);margin-right:6px}
:root[data-theme="dark"] .loot .px{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .loot .px{color:var(--yellow)}}
.card .clear-stamp{display:none;position:absolute;right:20px;top:18px;font-family:var(--pixel);font-size:.8rem;background:var(--yellow);color:#1D2B53;padding:10px 12px;box-shadow:0 0 0 4px #1D2B53;transform:rotate(-4deg)}
.card.cleared .clear-stamp{display:block}
.card.cleared .hp{visibility:hidden}
.card.flash{outline:6px solid var(--blue);outline-offset:6px}
.you-wrote{margin-top:16px}
.you-wrote summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.you-wrote p{white-space:pre-wrap;margin-top:8px;font-size:.95rem;border-left:4px solid var(--soft);padding-left:12px}
.loading{color:var(--ink-2);font-style:italic}

/* Checkpoints & power-ups */
.rows{margin:0 4px}
details.row{border-top:3px solid var(--soft)}
details.row:first-child{border-top:0}
details.row > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 22px;font-weight:700}
details.row > summary::-webkit-details-marker{display:none}
details.row > summary::after{content:"+";font-family:var(--pixel);font-size:.8rem;color:var(--ink-2)}
details.row[open] > summary::after{content:"-"}
.row-body{padding:0 22px 20px}
.row-body h4{font-family:var(--pixel);font-weight:400;font-size:.55rem;margin:12px 0 8px;color:var(--ink-2)}
.pip{display:inline-flex;gap:2px;margin-left:auto;margin-right:6px}
.pip i{width:10px;height:10px;background:var(--soft)}
.pip.met i:nth-child(-n+2){background:var(--met)}
.pip.ex i{background:var(--green)}
.stars{display:inline-flex;gap:4px}
.stars i{width:14px;height:14px;background:var(--soft);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.stars i.on{background:var(--orange)}
.bonus-status{display:flex;align-items:center;gap:10px;margin-left:auto;margin-right:6px}
.bclear{display:none;font-size:.5rem;background:var(--yellow);color:#1D2B53;padding:4px 6px}
details.row.bonus.cleared .bclear{display:inline-block}
.obj{display:grid;gap:4px}
.note{margin-left:36px}
.note summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--blue-deep);display:flex;gap:8px;align-items:center;list-style:none}
.note summary::-webkit-details-marker{display:none}
.note summary .xpv{margin-left:0;padding-top:0}
.note textarea{width:100%;margin-top:6px;font:inherit;font-size:.95rem;padding:10px;border:0;background:var(--panel);color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.note textarea:focus{box-shadow:0 0 0 3px var(--blue);outline:none}
.evbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.copybox{width:100%;margin-top:10px;font:inherit;font-size:.9rem;padding:10px}
.power{display:inline-grid;place-content:center;width:26px;height:26px;background:var(--yellow);box-shadow:0 0 0 3px #1D2B53;margin-right:12px;font-family:var(--pixel);font-size:.6rem;color:#1D2B53;flex:none}
.rname{display:flex;align-items:center}

/* Achievements */
.achievements{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:3px dashed var(--soft)}
.ach{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;padding:4px 10px 4px 4px;background:var(--soft);color:var(--ink-2);opacity:.6}
.ach.on{opacity:1;color:var(--ink);background:color-mix(in srgb,var(--yellow) 55%,var(--panel))}
.ach .ico{width:26px;height:26px;display:grid;place-content:center;background:var(--panel);font-family:var(--pixel);font-size:.55rem;box-shadow:0 0 0 2px var(--ink)}
.ach.on .ico{background:var(--yellow);color:#1D2B53}

/* Deadline Dash */
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.dash-top h1{font-size:clamp(1.1rem,3.5vw,1.6rem)}
.dash-wrap{padding:14px;margin:4px}
#dash{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;cursor:pointer;background:#FFF1E8}
.dash-hud{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dash-help{color:var(--ink-2);margin-top:14px}
.break-btn{margin-top:10px}

/* Pop-ups */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1D2B53;color:#FFF1E8;padding:12px 18px;z-index:45;display:none;box-shadow:0 0 0 4px var(--yellow);text-align:center;max-width:90vw}
.toast .px{font-size:.55rem;color:var(--yellow);display:block;margin-bottom:6px}
.toast.show{display:block}
.levelup{position:fixed;inset:0;display:grid;place-content:center;z-index:50;pointer-events:none}
.levelup div{font-family:var(--pixel);font-size:clamp(1.8rem,7vw,3.6rem);color:var(--yellow);text-shadow:4px 4px 0 var(--red),8px 8px 0 #1D2B53;text-align:center;animation:lvl 2s steps(10) forwards}
.levelup small{display:block;font-size:.8rem;color:#1D2B53;text-shadow:none;background:var(--yellow);padding:8px;margin-top:14px}
@keyframes lvl{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.burst{position:absolute;left:24px;top:22px;pointer-events:none}
.burst i{position:absolute;width:8px;height:8px;animation:pop .6s steps(6) forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y));opacity:0}}

.foot{margin-top:50px;padding-top:20px;border-top:3px dashed var(--soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.linkbtn{all:unset;cursor:pointer;color:var(--blue-deep);font-weight:700;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){
  .blink,.sprite svg,.qblock.bump,.coin,.levelup div,.burst{animation:none!important}
  .sprite,.tip{transition:none}
}
@media (max-width:680px){
  .player{grid-template-columns:auto 1fr;gap:16px;padding:18px}
  .avatar{width:64px;height:76px;padding:4px}
  .qwrap{grid-column:1 / -1;display:flex;align-items:center;gap:14px;text-align:left}
  .qwrap .px{margin-top:0}
  .qblock{width:64px;height:64px;font-size:1.5rem}
  .qblock::before{top:6px;left:6px;box-shadow:46px 0 0 #1D2B53,0 46px 0 #1D2B53,46px 46px 0 #1D2B53}
  .card{padding:20px 16px}
  .card .clear-stamp{position:static;display:none;margin-bottom:10px;width:max-content}
  .card.cleared .clear-stamp{display:block}
  details.row > summary{padding:14px 16px}
  .row-body{padding:0 16px 18px}
}
</style>
</head>

<header class="bar">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FFA300" d="M5 0h1v2h1v2h3v1h-1v1h-1v2h1v2h-1v-1h-1v-1h-1v1h-1v1h-1v-2h1v-2h-1v-1h-1v-1h3v-2h1z"/></svg>LEVEL <span class="up">UP</span><span class="cobrand">by TPXimpact</span></div>
  <div id="barRight" style="display:flex;gap:6px;align-items:center"></div>
</header>
<main id="main" tabindex="-1"></main>

ive design culture, championing accessibility and inclusive approaches in delivery and with clients", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Create visually accessible and legible design outputs\n\n\u2022 Understand and ensure the ethical dimensions of organisation design work (eg. equity, fairness, bias)\n\n\u2022 Ensure inclusive, ethical, and accessible approaches in all aspects of organisation design work, ensuring compliance with relevant standards and working with research colleagues to actively seek feedback from diverse user groups.\n\n\u2022 Apply digital accessibility principles as part of continuous improvement working effectively with interaction designers, developers/ and other technical experts", "Expert": "\u2022 Work with the Head of Practice to champion proactive ethical, safeguarding, accessibility and inclusive thinking across the practice\n\n\u2022 Champion accessibility approaches in client teams and call out when a client is not adopting existing standards", "Leader": "", "Driver": ""}, "Accessibility and inclusion (Service Design)": {"desc": "Contributing to an inclusive design culture, championing accessibility and inclusive approaches in delivery and with clients", "Learner": "\u2022 Create visually accessible and legible design outputs\n\n\u2022 Understand the ethical dimensions of service design work (eg. equity, fairness, bias)", "Contributor": "\u2022 Map and manage risks that people might have when using the service\n\n\u2022 Design services that are inclusive, ethical, and accessible, ensuring compliance with relevant standards and work with research colleagues to actively seek feedback from diverse user groups.", "Skilled": "\u2022 Apply digital accessibility principles as part of continuous improvement working effectively with interaction designers, developers/ and other technical experts", "Expert": "\u2022 Work with the Head of Practice to champion proactive ethical, safeguarding, accessibility and inclusive thinking across the practice\n\n\u2022 Champion accessibility approaches in client teams and call out when a client is not adopting existing standards", "Leader": "", "Driver": ""}, "Agile and lean knowledge": {"desc": "", "Learner": "\u2022 You're familiar with agile principles and are able to implement agile ways of working for a delivery team with support, taking ownership and running all agile ceremonies.\n\n\u2022 You are aware of other delivery approaches such as User Centred Design, Lean, Kanban, Waterfall, Paired programming and Extreme Programming but limited or no experience of delivering using these approaches.", "Contributor": "\u2022 You're comfortable with agile principles and day to day working practices and are able to implement agile ways of working for a delivery team without guidance, taking ownership and running all agile ceremonies.\n\n\u2022 You have a baseline understanding of how differing delivery approaches may compliment each other along with the associated benefits, as well as the ability to articulate where why one approach may be more suitable than another for any given project.", "Skilled": "\u2022 You're comfortable with agile principles and day to day working practices and are able to implement agile ways of working for a delivery team without guidance, taking ownership and running all agile ceremonies.\n\n\u2022 You have the ability to articulate why one delivery approach may be more suitable than another for any given project, influence the client to adopt the chosen approach, and are seen as somebody who supports lesser experienced Delivery Managers.", "Expert": "\u2022 You're highly proficient in Agile principles and practices, with the ability to implement and adapt Agile methodologies to suit various project contexts. You lead Agile ceremonies and ensure they are effective.\n\n\u2022 While able to mentor and coach team members on Agile principles. \n\n\u2022 You implement and adapt Agile methodologies to fit the project context and able to measure and evaluate outcomes, encouraging a mindset of experimentation and continuous improvement. You influence clients to adopt Agile approaches and provide thought leadership on Agile practices.", "Leader": "\u2022 Working in an agile way is second nature and you're seen as an authority in this space.\n\n\u2022 You're able to articulate why one delivery approach may be more suitable than another for any given project, influence the client to adopt the chosen approach, and are seen as the 'go-to' person for agile related information and support.`\n\n\u2022 You're seen as a thought leader on this topic and would be comfortable delivering COP sessions, hosting discussions or presenting on agile ways of working.", "Driver": ""}, "Asset and configuration management": {"desc": "", "Learner": "\u2022 Track, log and correct information to protect assets and components", "Contributor": "\u2022 Maintain secure configuration and accurate information, controlling IT assets in one or more significant areas\n\n\u2022 Verify the location and state of assets", "Skilled": "\u2022 Manage configuration items, related information, service compliance and risks", "Expert": "\u2022 Manage configuration management for the organisation, ensuring value for the business and adherence to company policies\n\n\u2022 Ensure that changes to assets are recorded and controlled appropriately\n\n\u2022 Advocate organisational commitment to asset control", "Leader": "", "Driver": ""}, "Automation and testing": {"desc": "", "Learner": "\u2022 Correctly execute test scripts under supervision\n\n\u2022 Understand the role of testing and how it works\n\n\u2022 Understand automation of tests", "Contributor": "\u2022 Review requirements and specifications, and define test conditions\n\n\u2022 Identify issues and risks associated with work\n\n\u2022 Analyse and report test activities and results\n\n\u2022 Begin automating test processes", "Skilled": "\u2022 Manage the planning of system and acceptance tests, co-ordinating both functional and non-functional specifications\n\n\u2022 Provide authoritative advice and guidance on test planning\n\n\u2022 Identify process improvements and contribute to the definition of best practice\n\n\u2022 Can fully automate test processes", "Expert": "\u2022 Manage testing activities within development or integration activities\n\n\u2022 Provide authoritative advice and guidance on test planning\n\n\u2022 Manage risks and take preventative action when risks become unacceptable\n\n\u2022 Manage customer relations\n\n\u2022 Ensures automation of processes", "Leader": "", "Driver": ""}, "Availability, robustness and capacity management": {"desc": "", "Learner": "\u2022 Show an awareness of availability and capacity management processes\n\n\u2022 Learn about well architected principles", "Contributor": "\u2022 Manage service components to ensure they meet business needs and performance targets\n\n\u2022 Awareness that all parts of the service work well and can handle the business needs and performance goals\n\n\u2022 Aware of well architected principles", "Skilled": "\u2022 Ensure that all parts of the service work well and can handle the business needs and performance goals\n\n\u2022 Ensure the correct implementation of standards and procedures\n\n\u2022 Identify capacity issues, and stipulate and instigate the required changes\n\n\u2022 Initiate remedial action\n\n\u2022 Aware of and suggest well architected principles", "Expert": "\u2022 Ensure that all parts of the service work well and can handle the business needs and performance goals\n\n\u2022 Ensure ongoing service monitoring and scalability/business continuity\n\n\u2022 Follow well architected principles", "Leader": "", "Driver": ""}, "Business analysis": {"desc": "", "Learner": "\u2022 You show an awareness of structured approaches to identify business problems and opportunities. You work under direct supervision to gather basic information and support the team in defining simple requirements.", "Contributor": "\u2022 You support structured approaches to investigate and analyse routine business problems. You work under light supervision to analyse business goals, objectives, and processes, using underlying data to support requirement definitions.", "Skilled": "\u2022 You can apply structured approaches to identify, investigate, analyse and communicate complex business problems and opportunities within a defined project. You independently analyse business goals, objectives, functions and processes, using relevant information and data to define clear requirements", "Expert": "\u2022 You can advise on the approach to identify, investigate, analyse and communicate complex business problems and opportunities within a project or programme of work. You inform and guide tactical decision-making and help define the formation of longer-term plans in evolving, unpredictable environments.", "Leader": "\u2022 You set the direction for business analysis within a major programme of work, enterprise, or wider sector. You guide tactical decision-making and directly influence the formulation of longer-term strategic plans across complex, ambiguous settings.", "Driver": "\u2022 You hold ultimate accountability for the Business Analysis profession, quality standards, and capability across the entire department. You influence macro-level government strategies, define cross-organisational analytical frameworks, and advise senior officials on high-risk, complex transformational investments."}, "Business modelling": {"desc": "", "Learner": "\u2022 You demonstrate a basic understanding of business modelling techniques. You can support the representation of simple business situations within the strictly defined parameters of a task.", "Contributor": "\u2022 You can visualise and map distinct, localized business processes with minimal direction. You support the creation of foundational operational models to represent current-state scenarios.", "Skilled": pendencies, and ensure that workflow changes translate into measurable operational efficiencies.", "Leader": "\u2022 You set the direction within a programme or enterprise to identify opportunities to perform business activities in alternative ways. You lead the exploration of ways to improve process efficiency and enhance business outcomes, enabling others to recognise the potential for change in ambiguous settings.", "Driver": "\u2022 You establish the strategic continuous improvement vision and performance frameworks across the entire client portfolio of services. You direct large-scale operational transformations, orchestrate major automation and efficiency drives, and negotiate cross-governmental or industry shifts to optimise service delivery on a large scale."}, "Capability building (Content Design)": {"desc": "Supporting capability building through informal and formal training, coaching or paired-working with other designers or client teams.", "Learner": "\u2022 Understand and support training approaches as part of delivery", "Contributor": "\u2022 Contribute and own elements of training and skills transfer approaches as part of delivery\n\n\u2022 Work as part of 1-to-1 capability pairing to transfer skills and knowledge to others in a team\n\n\u2022 Mentor others, including more junior colleagues in your practice", "Skilled": "\u2022 Line manage 1-2 mid level collegues in your practice \n\n\u2022 Mentor and proactively support others in client team to build skills and confidence\n\n\u2022 Run and faciliate learning activities e.g. lunch and learns and/or more formal training sessions\n\n\u2022 Co-develop design training approaches and activities that increase the skills and confidence of clients", "Expert": "\u2022 Line manage 1-4 senior collegues in your practice \n\n\u2022 Mentor and lead others across our design capabilities when on client work \n\n\u2022 Own the development of content design training approaches and activities that increase the skills an leagues.", "Learner": "\u2022 Show willingness to collaborate and work openly with others", "Contributor": "\u2022 Work effectively with other types of designers (content, research and interaction)\n\n\u2022 Work effectively with developers and continuous development teams\n\n\u2022 Work with content and interaction designers to map user interactions across a product or service", "Skilled": "\u2022 Develop design libraries (including documenting service patterns) and style guides that other designers and developers can use\n\n\u2022 Effectively engage sceptical colleagues or clients with low digital maturity in understanding the value of design\n\n\u2022 Raise issues quickly to make sure work stays on track", "Expert": "\u2022 Effectively engage senior stakeholders in project activities\n\n\u2022 Effectively lead work within teams, or specific workstreams within programmes of work \u2013 in collaboration with project directors, sponsors and delivery managers\n\n\u2022 Assure the quality of work done by others is to the high standards expected, providing constructive feedback and identifying gaps in skills", "Leader": "", "Driver": ""}, "Communication (testing)": {"desc": "", "Learner": "\u2022 Ask clarifying questions to ensure comprehension of tasks and requirements.\n\n\u2022 Provide updates on task progress to the team and immediate supervisor.", "Contributor": "\u2022 Report test results and issues to the development team and direct supervisor\n\n\u2022 Participate in team meetings and contribute to discussions\n\n\u2022 Write clear and concise bug reports", "Skilled": "\u2022 Describe test strategies and plans with the development team\n\n\u2022 Collaborate with developers to understand and clarify requirements\n\n\u2022 Playback bug reports\n\n\u2022 Manage communication within the testing team and with other departments", "Expert": "-communicate with technical and non-technical stakeholders at all levels, and across organisations\n\n\u2022 Accurately explain the risk/urgency around regressions\n\n\u2022 Negotiate testing priorities and timelines", "Leader": "", "Driver": ""}, "Context, problem and option analysis": {"desc": "", "Learner": "\u2022 You can demonstrate an awareness of how to identify a business problem or opportunity. You can support the gathering of basic data to help understand a simple operational context under direct supervision.", "Contributor": "\u2022 You can assist in identifying the root causes of simple business problems. You can use standard techniques to document the current context and support the team in outlining basic options for change.", "Skilled": "\u2022 Ou can independently plan and use appropriate analysis techniques to understand a complex problem and its root causes. You can define clear problem statements and develop and evaluate multiple options for a defined project.", "Expert": "\u2022 You can advise on and lead the approach to understanding the context, problem, and root causes across a programme of work. You ensure problem statements align with strategic goals and facilitate the evaluation of high-impact options.", "Leader": "\u2022 You set the strategic direction and methodology for context and option analysis across an enterprise. You guide senior leadership in evaluating major strategic options, ensuring alignment with long-term organisational goals.", "Driver": "\u2022 You hold ultimate accountability for how systemic, cross-departmental problems are analysed and framed. You influence high-level government policy and investment decisions by championing robust option analysis frameworks."}, "Continual service improvement": {"desc": "", "Learner": "\u2022 Show an awareness of developing process efficiency and common ways in which processes are optimised\n\n\u2022 Support specific activities to improve development processes\n\n\u2022 Spot or identify obvious deficiencies", "Contributor": "\u2022 Identify process optimisation opportunities with guidance, and contribute to the implementation of proposed solutions", "Skilled": "\u2022 Analyse current processes, and identify and implement opportunities to optimise them\n\n\u2022 Lead and develop a team of experts to deliver service improvements\n\n\u2022 Help to evaluate and establish requirements for the implementation of changes by setting policy and standards", "Expert": "\u2022 This skill level is currently not defined.", "Leader": "", "Driver": ""}, "Customer service management (Cloud)": {"desc": "", "Learner": "\u2022 Resolve user requests to a minimum of the agreed service level agreement.\n\n\u2022 Empathise with the end user.\n\n\u2022 Use customer-focused metrics to achieve a satisfactory outcome.\n\n\u2022 Take responsibility for assigned issues and support their progression towards resolution.", "Contributor": "\u2022 Resolve user requests to a minimum of the agreed service level agreement.\n\n\u2022 Empathise with the end user.\n\n\u2022 Use customer-focused metrics to achieve a satisfactory outcome.\n\n\u2022 Own issues through to resolution, mitigation or successful handover to an appropriate owner.", "Skilled": "\u2022 Maintain a high level of customer service and have the confidence to deal with complex complaints.\n\n\u2022 Use empathy to satisfy customer demands.\n\n\u2022 Take ownership of complex issues and coordinate activities across teams to achieve resolution.\n\n\u2022 Ensure users remain informed and supported throughout the lifecycle of an issue.", "Expert": "\u2022 Maintain a high level of customer service and have the confidence to deal with complex complaints.\n\n\u2022 Use empathy to satisfy customer demands.\n\n\u2022 Take accountability for issues that occur and proactively identify potential problems before they affect users.\n\n\u2022 Drive excellent user outcomes through strong ownership, escalation management and continuous service improvement.\n\n\u2022 Foster a culture of accountability and customer focus across teams and suppliers.", "Leader": "", "Driver": ""}, "Data analysis and synthesis": {"desc": "", "Learner": "\u2022 Show an awareness of data profiling and how to identify and analyse data sources.", "Contributor": "\u2022 Undertake data profiling and source system analysis.\n\n\u2022 Present clear insights to colleagues to support the end use of data.", "Skilled": "\u2022 Understand and help teams to apply a range of techniques for data profiling\n\n\u2022 Undertake source system analysis from a complex single source\n\n\u2022 Bring multiple data sources together into an aggregated model for analysis", "Expert": "\u2022 Translate data into valuable insights that inform and influence decisions.\n\n\u2022 Lead teams in analytics and synthesis to increase consensus and challenge assumptions.\n\n\u2022 Identifies and utilises the most appropriate analytical techniques.\n\n\u2022 Keep up to date with advances in analytical tools and data manipulation products\n\n\u2022 Collect, collate, cleans, synthesises and interprets data to derive meaningful and actionable insights.", "Leader": "", "Driver": ""}, "Data development process": {"desc": "", "Learner": "\u2022 Show an awareness of the design, build and test of data products based on feeds from multiple systems, using a range of different storage technologies, access methods or both\n\n\u2022 Create repeatable and reusable products", "Contributor": "\u2022 Design, build and test data products based on feeds from multiple systems, using a range of different storage technologies, access methods or both\n\n\u2022 Create repeatable and reusable products", "Skilled": "\u2022 Design, build and test data products that are complex or large scale\n\n\u2022 Build teams to complete data integration services", "Expert": "\u2022 Establish enterprise-scale data integration procedures across the data development life cycle, and ensure that teams adhere to them\n\n\u2022 Manage resources to ensure that data services work effectively at an enterprise level", "Leader": "", "Driver": ""}, "Data engineering and manipulation": {"desc": "", "Learner": "\u2022 Show an awareness of the need for engineering support to design and deliver data products into the organisation.\n\n\u2022 Appreciate the need to cleanse and prepare data before including it in data products and can put reusable processes and checks in place.\n\n\u2022 Show an awareness of different architectures (including cloud and on-premise) and data manipulation and transformation tools.", "Contributor": "\u2022 Identify and engage with the appropriate engineering support to design and deliver data products into the organisation\n\n\u2022 Understand the reasons for cleansing and preparing data before including it in data products, recognise the processes and tools involved, and put reusable processes and checks in place.\n\n\u2022 Access and use different architectures (including cloud and on-premise) and data manipulation and transformation tools deployed within the organisation.", "Skilled": "\u2022 Work with data analytics, engineers and data science and AI specialists to design and deliver products into the organisation effectively.\n\n\u2022 Understand the reasons for cleansing and preparing data before including it in data products and can put reusable processes and checks in place.\n\n\u2022 Access and use a range of architectures (including cloud and on-premise) and data manipulation and transformation tools deployed within the organisation.", "Expert": "\u2022 Help to identify the data engineering requirements for any data product, while working with data analysts, data engineers and data science and AI specialists to design and deliver those products into the organisation effectively.\n\n\u2022 Instruct others of the need to cleanse and prepare data before including it in data products and can put reusable processes and checks in place.\n\n\u2022 Understand a broad range of architectures (including cloud and on-premise) and data manipulation and transformation tools deployed within the organisation, and can use these tools appropriately and help others use them.", "Leader": "", "Driver": ""}, "Data governance (data architect)": {"desc": "", "Learner": "", "Contributor": "\u2022 Understand what data governance is required\n\n\u2022 Take responsibility for the assurance of data solutions and make recommendations to ensure compliance", "Skilled": "\u2022 Evolve and define data governance\n\n\u2022 Take responsibility for supporting and collaborating around wider governance\n\n\u2022 Assure and integrate data services to meet the needs of multiple business services\n\n\u2022 Work proactively to ensure the organisation designs architecture that considers data", "Expert": "\u2022 Ensure data governance supports changes to the organisational strategy\n\n\u2022 Align data governance with wider governance (for example, budget)\n\n\u2022 Assure corporate services by understanding important risks and providing mitigation through assurance mechanisms", "Leader": "", "Driver": ""}, "Data integration design": {"desc": "", "Learner": "\u2022 Show an awareness of data solutions design in accordance with agreed organisational standards that ensure services are resilient, scalable and future-proof", "Contributor": "\u2022 Deliver data solutions in accordance with agreed organisational standards that ensure services are resilient, scalable and future-proof", "Skilled": "\u2022 Select and implement the appropriate technologies to deliver resilient, scalable and future-proofed data solutions", "Expert": "\u2022 Establish standards, keep them up to date and ensure adherence to them\n\n\u2022 Keep abreast of best practice in industry and across government", "Leader": "", "Driver": ""}, "Data life cycle": {"desc": "", "Learner": "", "Contributor": "\u2022 Understand and apply data governance over a data life cycle, ensuring best practice at each phase", "Skilled": "\u2022 Understand and apply data governance structures and principles over a data life cycle, ensuring best practice at each phase\n\n\u2022 Demonstrate knowledge of data governance industry standards\n\n\u2022 Design and implement continuous improvements to optimise data governance over a data life cycle\n\n\u2022 Work with internal and external stakeholders to build organisational capacity and capability in data governance", "Expert": "\u2022 Take responsibility for data governance structures and principles, and ensure that they\u2019re defined and applied with best practice throughout a data life cycle\n\n\u2022 Direct continuous improvements to optimise data governance over a data life cycle", "Leader": "", "Driver": ""}, "Data management": {"desc": "", "Learner": "\u2022 Show an awareness of organisational data governance, and how it works in relation to other organisational governance structures", "Contributor": "\u2022 Understand data governance and how it works in relation to other organisational governance structures\n\n\u2022 Participate in or deliver the assurance of a service", "Skilled": "\u2022 Advocate data governance and data management standards and guidelines within your team\u2019s products and services\n\n\u2022 Continually communicate and improve data management practices in your teams\n\n\u2022 Help define and support the use of common toolsets\n\n\u2022 Seek to automate data management activities where possible\n\n\u2022 Develop processes to enable good data management practices and compliance with data governance policies", "Expert": "\u2022 Ensure data management and governance processes are in place and adhered to for the products and services your teams provide\n\n\u2022 Ensure data management responsibilities are clearly defined and training is in place to enable the execution of data management practices\n\n\u2022 Define strategies to enable continual improvement of data management practices and compliance with data governance policies", "Leader": "", "Driver": ""}, "Data modelling": {"desc": "", "Learner": "", "Contributor": "\u2022 Explain the concepts and principles of data modelling\n\n\u2022 Produce, maintain and update relevant data models for an organisation\u2019s specific needs\n\n\u2022 Reverse-engineer data models from a live system", "Skilled": "\u2022 Produce relevant data models across multiple subject areas\n\n\u2022 Explain which models to use for which purpose\n\n\u2022 Understand industry-recognised data modelling patterns and standards, and when to apply them\n\n\u2022 Compare and align different data models", "Expert": "\u2022 Understand the concepts and principles of data modelling and can produce relevant data models\n\n\u2022 Work across government and industry, recognising opportunities for the reuse and alignment of data models in different organisations\n\n\u2022 Design the method to categorise data models within an organisation", "Leader": "", "Driver": ""}, "Data modelling, cleansing and enrichment": {"desc": "", "Learner": "\u2022 Show an awareness of different data models and tools, and understand when they could be used.\n\n\u2022 Show an awareness of industry-recognised data modelling patterns and standards.", "Contributor": "\u2022 Produce data models and understand where to use different types of data models.\n\n\u2022 Understand different tools and is able to compare different data models.\n\n\u2022 Reverse-engineer a data model from a live system.\n\n\u2022 Understand industry-recognised data modelling patterns and standards.", "Skilled": "\u2022 Build and review complex data models, ensuring adherence to standards.\n\n\u2022 Use data integration tools and languages to integrate and store data, and advise teams on best practice.\n\n\u2022 Ensure data for analysis meets data quality standards and is interoperable with other data sets, enabling their reuse.\n\n\u2022 Work with other data professionals to improve modelling and integration patterns and standards.", "Expert": "\u2022 Understand different ways to model data to maximise its use and value.\n\n\u2022 Ensure data is modelled appropriately, and modelling standards exist and are complied with.\n\n\u2022 Understand a number of data integration tools and patterns, and ensure your teams have the support and training needed to use the most appropriate methods.\n\n\u2022 Build relationships with other senior data professionals (in fields such as data architecture, data engineering and data science) to share best practice and continually improve data modelling and integration processes and standards.", "Leader": "", "Driver": ""}, "Data standards (data architect)": {"desc": "", "Learner": "", "Contributor": "\u2022 Refine, develop or apply data standards for a specific component\n\n\u2022 Analyse where data standards have been applied or breached, and undertake an impact analysis of that breach", "Skilled": "\u2022 Refine, develop or apply and set data standards across multiple subject areas\n\n\u2022 Act as the escalation point for breaches of data standards and make recommendations about how the organisation should resolve them\n\n\u2022 Formulate data strategies, including standards of data quality, the flow of data within an organisation, and security of data", "Expert": "\u2022 Develop and set data standards for an organisation\n\n\u2022 Communicate the business benefit of data standards, championing and governing them across the organisation\n\n\u2022 Understand where standards need to be set across an organisation, and how to set the standards within an organisation in the wider context of government\n\n\u2022 Formulate data strategies, including standards of data quality, the flow of data within an organisation, and security of data", "Leader": "", "Driver": ""}, "Delivery (Conducting research and analysis) (Design Research)": {"desc": "Where research and analysis contributes to success in delivery. This may include understanding of a domain area, or prototyping and testing different solutions, as well as delivery of a final outcome as part of multi-disciplinary teams", "Learner": "\u2022 Awareness of best practices for research material design, various question types, and types research probes\n\n\u2022 Apply active listening techniques, observation and note-taking\n\n\u2022 Have some awareness of grounded theory and thematic analysis\n\n\u2022 Apply basic techniques, such as affinity mapping, for the analysis of research data", "Contributor": "\u2022 Create observation and note-taking guides that team members and stakeholder can follow and use for variety of research methods. Including training and guiding others in effective and non-biased observation and note-taking\n\n\u2022 Apply active listening techniques, responding and adapting to participant's verbal and non-verbal cues naturally. Including independently running interviews and usability tests using clear discussion guides or testing scripts and conversational techniques (both in person and remotely)\n\n\u2022 Facilitate teams to adopt regular analysis and synthesis processes, building up a reliable repository of knowledge for projects, enabling continuous improvement and evidence-based decision making\n\n\u2022 Align research findings to inform decision-making and action", "Skilled": "\u2022 Understand other relevant research within a programme and proactively collaborate with other researchers to share learnings across a problem space. Reducing duplication and optimise participant research\n\n\u2022 Create a variety of engaging research materials and probes, applying the appropriate question types for the topic and research objective\n\n\u2022 Run various research methods, both moderated and unmoderated, in person and remotely\n\n\u2022 Apply effective analysis techniques to assure best practice and team/client confidence\n\n\u2022 Continously persuade, influence and build empathy with even the most sceptical stakeholders through research approaches", "Expert": "\u2022 Run qualitative and mixed method research encompassing a variety of ethical, safeguarding, inclusive and accessibility considerations where relevant. Including leading, training and coaching to deliver through others in these areas\n\n\u2022 Draw on social or technological context, and emerging technology or techniques to shape research, analysis and design approaches appropriately\n\n\u2022 Align organisational and programme policy commitments with robust evidence and insights to influence and facilitate strategic change\n\n\u2022 Use research and analysis strategically to contribute to practical business cases, spend review, briefing reports for organisational and programme policy commitments mapped to risk and impact\u2013bringing together inputs from other designers, researchers and technologists", "Leader": "", "Driver": ""}, "Delivery (Conducting research and analysis) (Impact Analysis)": {"desc": "Where research and analysis contributes to success in delivery. This may include understanding of a domain area, or prototyping and testing different solutions, as well as delivery of a final outcome as part of multi-disciplinary teams", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Conduct qualitative research - 1:1 interviews, workshops and surveys \u2014 that will help shape the development of evidence based strategic recommendations. Including the creation of relevant and engaging research materials.\n\n\u2022 Collect, manage and analyse typically messy and disparate data to produce insights that support evidence-based decision making\n\n\u2022 Apply effective statistical analysis techniques to assure best practice and team/client confidence (e.g., means, medians, percentiles, correlations) and interpret the results. Using basic to medium complexity data formulas and functions and apply effective analysis techniques and key statistical concepts, including straightforward data manipulation that assures best practice and team/client confidence\n\n\u2022 Use relevant data tools to explore specific issues. Including being able to use descriptive statistics (average) and use graphs and charts to check for outliers and missing cases\n\n\u2022 Create compelling and practical business cases that brings together inputs from other designers, researchers and technologists\n\n\u2022 Clearly communicate and visualise organisational or client data to investigate trends and develop insights of potential risks and impacts of the proposed change\n\n\u2022 Continuously persuade, influence and build empathy and confidence with even the most sceptical stakeholders through approaches", "Expert": "\u2022 Run impact and quantitative research and analysis encompassing a variety of ethical, safeguarding, inclusive and accessibility considerations where relevant. Including leading, training and coaching to delivery through others in these areas\n\n\u2022 Draw on social or technological context, and emerging technology or techniques to shape research, analysis and design approaches appropriately\n\n\u2022 Align organisational and programme policy commitments with robust evidence and insights to influence and facilitate strategic change\n\n\u2022 Evaluate the effectiveness of policy, services and key organisation functions, scoping and shape the size of opportunities for improvement\n\n\u2022 Use research and analysis strategically to contribute to practical business cases, spend review, briefing reports for organisational and programme policy commitments mapped to risk and impact\u2013bringing together inputs from other designers, researchers, analyst, data engineers and technologists", "Leader": "", "Driver": ""}, "Delivery (Design, prototyping and testing) (Org Design)": {"desc": "Where organisation design contributes to delivery. This includes designing, prototyping and testing different solutions as well as delivery of final outcomes as part of multi-disciplinary teams. Outputs may include 'as is' service mapping, blueprints and the creation of other service artefacts, with planning and facilitation of activities that support service-based approaches", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Work effectively with client stakeholders to build awareness and understanding of their services, organisation and system landscape \n\n\u2022 Lead and co-ordinate work to understand the underlying systems, technologies, organisational processes, and data practices that support the delivery of policy and services \n\n\u2022 Effectively map and produce effective artefacts that communicate the technology stack, processes, or operational componants which support services\n\n\u2022 Design business and operating models, organisational structures, processes, practices, incentives, behaviours, culture and ways of working\n\n\u2022 Prototype and evaluate organisation structures, processes, frameworks, products and/or services using a mix of methodologies to gain different insights at different stages of design\n\n\u2022 Create clear and unambiguous governance processes, including agreeing who has authority to make decisions and how they are made when multiple areas impact service or organisation touchpoints\n\n\u2022 Contribute to discussions about future technical investment, change, or service maintenance needs\n\n\u2022 Facilitate impact measurement through the development of outcomes / performance frameworks and theories of change for key interventions", "Expert": "\u2022 Coach and upskill client teams to identify, define and shape how they design, build and iterate their services as part of fully-integrated change in their organisations\n\n\u2022 Lead senior stakeholders to explore, shape, and prioritise ideas, propositions and opportunities to support longer term digital transformation goals\n\n\u2022 Plan, and lead service piloting, evaluating, iterating, and planning for robust, scalable, and deeply integrated change needed in organisations\n\n\u2022 Ensure robust impact measurement of interventions, organisations, products and services, including theories of change and preparation of business cases\n\n\u2022 Build compelling and practical business cases with the support of quantitative and qualitative data including the underpinning financial model", "Leader": "", "Driver": ""}, "Delivery (design, prototyping and testing) (Service Design)": {"desc": "Where service design contributes to delivery. This includes designing, prototyping and testing different solutions as well as delivery of final outcomes as part of multi-dsciplinary teams. Outputs may include 'as is' service mapping, blueprints and the creation of other service artefacts, with planning and facilitation of activities that support service-based approaches", "Learner": "\u2022 Support a range of service design activities and create visual artefacts\n\n\u2022 Understand how to use prototyping to test ideas, assumptions and hypotheses", "Contributor": "\u2022 Capture, map, and communicate 'as-is' service landscapes, including changes expected in the future and planning for any service or change consequences\n\n\u2022 Design, map, and communicate 'to-be' services clearly and creatively \n\n\u2022 Generate and explore solutions using a range of visual methods, and different fidelity of service prototyping to test assumptions and hypotheses\n\n\u2022 Understand how technology, data, infrustrature supports services to run and operate\n\n\u2022 Apply style guides and work effectively with design systems", "Skilled": "\u2022 Effectively communicate how an incoming or current policy affects a service\n\n\u2022 Work effectively with client stakeholders to build awareness and understanding of their services, organisation and system landscape \n\n\u2022 Effectively map and communicate the technology stack, or operational componants which supports a service\n\n\u2022 Contribute to discussions about future technical investment, change, or service maintenance needs\n\n\u2022 Create clear and unambiguous governance processes, including agreeing who has authority to make decisions and how they are made when multiple areas impact service touchpoints\n\n\u2022 Create and test more complex change scenarios using service prototypes, including supporting how prototypes transition into scalable service pilots\n\n\u2022 Support client teams to work towards and pass service assessments in different sectors", "Expert": "\u2022 Coach and upskill client teams to identify, define and shape how they design, build and iterate their services as part of fully-integrated change in their organisations\n\n\u2022 Lead senior stakeholders to explore, shape, and prioritise ideas, propositions and opportunities to support longer term digital transformation goals\n\n\u2022 Plan, and lead service piloting, evaluating, iterating, and planning for robust, scalable, and deeply integrated change needed in organisations\n\n\u2022 Ensure robust impact measurement of interventions, organisations, products and services, including theories of change and preparation of business cases\n\n\u2022 Build compelling and practical business cases with the support of quantitative and qualitative data including the underpinning financial model", "Leader": "", "Driver": ""}, "Delivery (Prototyping and testing) (Interaction Design)": {"desc": "Where interaction and product design contributes to delivery. This may include mapping, prototyping and testing different solutions as well as delivering a final digital outcome (beta, alpha, live) as part of a multidisciplinary team while using common and emerging design standards", "Learner": "\u2022 Understand how to map user interactions, and support others in doing so\n\n\u2022 Understand the principles of information architecture, micro-interaction and graphic/visual design, and support how prototypes are created using a mix of methods\n\n\u2022 Understand approaches and how to use and reference design systems", "Contributor": "\u2022 Map user interactions and the golden path of component tasks that enable users to achieve their goal, working independently when required\n\n\u2022 Apply principles of information architecture, micro-interaction and graphic/visual design to create prototypes using a mix of methods (paper, clickable and code)\n\n\u2022 Apply the right level of visual (low/high) fidelity needed to test an idea depending on the time and context\n\n\u2022 Work with design systems\n\n\u2022 Understand how code influences design and deployment decisions\n\n\u2022 Understand the value of prototyping in code using GOV.UK and NHS prototype kits", "Skilled": "\u2022 Apply visual/graphic design principles to create intent that is understood by developers\n\n\u2022 Know the difference between patterns, components and using style foundations to create a design language\n\n\u2022 Take experimental approaches to prototyping to prove/disprove hypotheses and influence decision making in ways that impacts priorities and development\n\n\u2022 Apply, and guide others to use various levels of fidelity (visual, interaction, content, data, etc) appropriately to test multiple ideas\n\n\u2022 Work with, and contribute to design systems, including the GOV.UK and NHS Design Systems\n\n\u2022 Audit designs for consistency, reducing complex design and tech debt\n\n\u2022 Create test plans and discussion guides to test prototypes and ideas", "Expert": "\u2022 Conduct code reviews with developers \n\n\u2022 Contribute to code repositories (for example, Github) for projects that involve developers \n\n\u2022 Develop automated tests in collaboration with developers \n\n\u2022 Contribute to the GOV.UK and NHS Design Systems, including code\n\n\u2022 Create and maintain design systems from scratch\n\n\u2022 Embed and manage governance and contribution processes for design systems", "Leader": "", "Driver": ""}, "Delivery (Prototyping, testing and implementing) (Content Design)": {"desc": "Where content design contributes to success in delivery. This may include prototyping, testing different content approaches before applying the selected approach on a project as part of a multi-disciplinary team", "Learner": "\u2022 Write micro-copy for a digital interface in basic contexts\n\n\u2022 Write or edit longform content in basic contexts\n\n\u2022 Understand how style guides are used and applied\n\n\u2022 Have some awareness of apporaches to prototypoing and testing content", "Contributor": "\u2022 Write micro-copy for a digital interface \n\n\u2022 Write or edit longform content\n\n\u2022 Use and apply style guides to content\n\n\u2022 Describe or draw a low fidelity prototype that demonstrates how content design should be applied to a specific part of product or service\n\n\u2022 Apply basic content testing methods\n\n\u2022 Link information architecture to content design for products or services", "Skilled": "\u2022 Write or edit longform content in a range of contexts (websites, presentations, comms material)\n\n\u2022 Work with interaction designers to create micro-copy that is supported by style guidelines\n\n\u2022 Co-develop style guides and pattern libraries with others\n\n\u2022 Create more advanced prototypes for multiple parts of a product or service. \n\n\u2022 Make basic edits to a Figma (or other software) prototype created by an interaction designer\n\n\u2022 Test content using techniques such as highlighter testing, eye tracking or through talking users through content \n\n\u2022 Create content information architecture for products and services\n\n\u2022 Test information architecture (IA) using techniques such as card sorting, and tools such as Optimal Workshop\n\n\u2022 Have some knowledge of Figma and can adapt - or in some cases create - a prototype in figma.\n\n\u2022 Use the gov.uk or NHS prototyping kits, if needed", "Expert": "\u2022 Develop guidelines on how to create long form content and micro-copy for other content designers to follow\n\n\u2022 Lead the development of style guides and content pattern libraries where relevant\n\n\u2022 Run pair writing sessions with a wide range of stakeholders and SMEs, and feel confident coming up with new approaches to pair writing if needed\n\n\u2022 Lead content teams in prototyping content across a whole product or service. \n\n\u2022 Apply more adcanced approaches to testing content using a wide range of methods\n\n\u2022 Facilitate others to define a service architecture and be comfortable leading an IA testing session such as a card sort, or running and analysing A/B and MVT testing of IA through (for example) Optimal Workshop", "Leader": "", "Driver": ""}, "Digital and data systems analysis": {"desc": "", "Learner": "\u2022 You show an awareness of digital and data systems. You can support the mapping of basic technical inputs and outputs under supervision to help understand system functions.", "Contributor": "\u2022 You can identify and document the basic functionality that digital systems deliver. You can assist in creating simple system or data models under direction.", "Skilled": "\u2022 You can independently identify and analyse system functionality and data flows. You can create accurate system and data models with minimal supervision, working within a multidisciplinary team to spot functionality gaps.", "Expert": "\u2022 You can lead complex technical and data systems analysis across a project or programme. You can design system interaction models, manage dependencies between legacy and new systems, and advise on integration risks.", "Leader": "\u2022 You set the standards and frameworks for digital and data systems analysis across the organisation. You drive the reuse of models, align systems architecture with business strategy, and coach others in advanced analytical techniques.", "Driver": "\u2022 You define the enterprise-wide vision for how system and data analysis drives technical transformation. You ensure that client portfolio systems are interoperable, secure, and resilient against future legacy debt."}, "Emerging technologies (Content Design)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "\u2022 Aware of emerging technologies e.g. large language models (LLMs), generative AI\n\n\u2022 Actively using productivity tools appropriately in your day to day work, including Gemini, and/or other equivelent tools in client tech-stacks or environments", "Contributor": "\u2022 Aware of how emerging technologies and approaches impact content design eg. large language models, prompt design, automated decision making, generative AI\n\n\u2022 Use productivity tools appropriately in your day to day work.", "Skilled": "\u2022 Understand and apply emerging technologies and approaches to content design work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Research and experiment further with emerging technologies and approaches as part of personal development time or innovation work", "Expert": "\u2022 Influence and guide how emerging technologies are applied to content design work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Emerging technologies (Design Research)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "\u2022 Aware of emerging technologies e.g. large language models (LLMs), generative AI\n\n\u2022 Actively using productivity tools appropriately in your day to day work, including Gemini, and/or other equivelent tools in client tech-stacks or environments", "Contributor": "\u2022 Aware of how emerging technologies and approaches impact design research eg. large language models, prompt design, automated decision making, generative AI\n\n\u2022 Use productivity tools appropriately in your day to day work.", "Skilled": "\u2022 Understand and apply emerging technologies and approaches to design research work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Draw on social or technological context, and emerging technology or techniques to shape research design appropriately (qualitative and quantitative). Including applying emerging technologies when given the opportunity to as part of project work\n\n\u2022 Research and experiment further with emerging technologies and approaches as part of personal development time or innovation work", "Expert": "\u2022 Influence and guide how emerging technologies are applied to research work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Emerging technologies (Design Strategy)": {"desc": "Using emerging technologies to augment you and your teams delivery abilities, and applying AI solutions to client problems where appropriate", "Learner": "n/a", "Contributor": "n/a", "Skilled": "n/a", "Expert": "n/a", "Leader": "\u2022 Understand and apply emerging technologies and approaches to work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Use productivity tools appropriately in your day to day work\n\n\u2022 Influence, and guide how emerging technologies are applied to project work across different domains and skillsets, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Driver": ""}, "Emerging technologies (Impact Analysis)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Understand and apply emerging technologies and approaches to work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Use productivity tools appropriately in your day to day work.\n\n\u2022 Research and experiment further with emerging technologies and approaches as part of personal development time or innovation work", "Expert": "\u2022 Influence and guide how emerging technologies are applied to impact and analysis work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Emerging technologies (Interaction Design)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "\u2022 Aware of emerging technologies e.g. large language models (LLMs), generative AI\n\n\u2022 Use productivity tools appropriately in your day to day work.", "Contributor": "\u2022 Aware of how emerging technologies and approaches impact interaction and product design eg. large language models, prompt design, automated decision making, generative AI\n\n\u2022 Confident in using AI productivity tools appropriately in your day to day work, and actively learning to apply interaction and product design approaches for AI supported services.", "Skilled": "\u2022 Understand and apply emerging technologies and approaches to work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Expert": "\u2022 Influence and guide how emerging technologies are applied to interaction and product design work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Emerging technologies (Org Design)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Use productivity tools appropriately in your day to day work\n\n\u2022 Understand and apply emerging technologies and approaches to work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Research and experiment further with emerging technologies and approaches as part of personal development time or innovation work", "Expert": "\u2022 Influence and guide how emerging technologies are applied to organisation design work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Emerging technologies (Service Design)": {"desc": "Working with emerging technologies, including AI and LLMs, to understand their impact on your practice area, applying them in appropriate ways", "Learner": "\u2022 Aware of emerging technologies e.g. large language models (LLMs), generative AI\n\n\u2022 Actively using productivity tools appropriately in your day to day work, including Gemini, and/or other equivelent tools in client tech-stacks or environments", "Contributor": "\u2022 Aware of how emerging technologies and approaches impact service design eg. large language models, prompt design, automated decision making, generative AI\n\n\u2022 Use productivity tools appropriately in your day to day work.", "Skilled": "\u2022 Proactively understand and apply emerging technologies and approaches to work eg. large language models (LLMs), prompt design, automated decision making, generative AI, following new developments closely\n\n\u2022 Research and experiment further with emerging technologies and approaches as part of personal development time or innovation work", "Expert": "\u2022 Influence and guide how emerging technologies are applied to service design work, including documentation of case studies and use cases to demonstrate value. \n\n\u2022 Monitor ethical usage or emerging technologies, ensuring the impact of solutions in considered and managed appropriately, working with other leaders in the business.", "Leader": "", "Driver": ""}, "Enterprise and business architecture": {"desc": "", "Learner": "\u2022 Support the translation of business drivers, goals and constraints into business objectives\n\n\u2022 Work under supervision to define required capabilities and support organisational changes to create operating models that meet business objectives", "Contributor": "\u2022 Work with limited direction to translate business drivers, goals and constraints into business objectives\n\n\u2022 Help to define required capabilities and support organisational changes to create operating models that meet business objectives", "Skilled": "\u2022 Support and advise on the development of a future state architecture aligned to strategy\n\n\u2022 Lead on the translation of business drivers, goals and constraints into business objectives\n\n\u2022 Define the capabilities required to create or develop operating models that meet business objectives", "Expert": "\u2022 Set the direction to develop a future state architecture aligned to strategy\n\n\u2022 Influence relationships between organisational structures, processes, technology, people and skills within and outside of an enterprise, to achieve transition to the new state", "Leader": "", "Driver": ""}, "Financial and project management": {"desc": "", "Learner": "\u2022 Co-ordinate the team to investigate problems, implement solutions and take preventive measure to improve project delivery.\n\n\u2022 You have a basic understanding of the financial management of a project. You are not managing the costs of projects directly but may be supporting a project lead in this role.\n\n\u2022 You have a basic understanding of where to go in TPXimpact with project-related issues.", "Contributor": "\u2022 You understand how to manage the finances of a project. You are not managing the costs of a project but are collecting data to inform a project lead about the financial health of a project.\n\n\u2022 You are beginning to understand quality control and how to escalate issues regarding a project within TPXimpact.\n\n\u2022 You're comfortable using TPXimpact tools and processes to manage projects effectively.", "Skilled": "\u2022 You have a thorough understanding of the financial management of a project. You are managing the costs of a project directly or sharing that responsibility with a project lead depending on scope.\n\n\u2022 You work with a project lead to ensure projects hit their utilisation targets and remain profitable.\n\n\u2022 You are beginning to get experience shaping work alongside a client and can contribute to the drafting of effective Statements of Work to define projects.", "Expert": "\u2022 You have a thorough understanding of financial and project management, with the ability to manage project costs and budgets effectively. You track project costs and manage budgets effectively while able to escalate financial issues in a timely manner and ensure financial transparency. \n\n\u2022 You provide guidance on financial management to team members and ensure that financial considerations are integrated into project planning and execution.", "Leader": "\u2022 You have an intimate understanding of the financial management of large projects and programmes. You are managing the costs of a project directly and are able to make informed decisions regarding resourcing based on the budget you manage.\n\n\u2022 You also ensure projects are hitting utilisation targets and that projects remain profitable for TPXimpact.\n\n\u2022 You are experienced in helping clients shape work and are able to craft effective Statements of Work alongside them to ensure teams have clarity on what they are working to deliver.", "Driver": ""}, "Functional testing": {"desc": "", "Learner": "\u2022 Show an awareness of functional testing techniques\n\n\u2022 Execute test scenarios and identify defects, raising awareness of them\n\n\u2022 Run tests others have written and know the processes to do so\n\n\u2022 Show an understanding of a range of standard testing techniques", "Contributor": "\u2022 Design and execute test cases using standard testing techniques\n\n\u2022 Come up with different business scenarios for a feature, working with others in the team", "Skilled": "\u2022 Advise on up-to-date functional testing techniques\n\n\u2022 Assess and peer-review the work of others\n\n\u2022 Coach and mentor others\n\n\u2022 Write test approaches for major projects and provide guidance on risk approaches\n\n\u2022 Devise new test techniques and provide recommendations", "Expert": "\u2022 Own the full testing lifecycle\n\n\u2022 Responsibile for overall testing strategy and client relationship\n\n\u2022 Advise on up-to-date functional testing techniques\n\n\u2022 Assess and peer-review the work of others\n\n\u2022 Coach and mentor others\n\n\u2022 Write test
