 introduce new approaches into your work and share these with others in your practice area.", "11: Principal": "\u2022 You model effective learning across projects you're working on. You're aware of how your approach and behaviour shape those around you.\n\n\u2022 You treat projects as opportunities for learning, innovation, and development, ensuring colleagues actively contribute to continuous improvement of our practices and approaches.\n\n\u2022 You shape the development of others at scale, drawing on your significant domain expertise to inform their plans and pathways.\n\n\u2022 You evolve the practice by bringing emerging and innovative approaches into how your practice area works.", "12: Head of": "\u2022 You set the direction for learning and capability across your practice area, ensuring the organisation builds the skills it will need for the future.\n\n\u2022 You act as a thought leader, holding a strong view of where your practice area is heading and shaping service provision towards it.\n\n\u2022 You represent and shape the practice, bringing industry thinking and learning back into your practice.\n\n\u2022 You create the conditions for others to lead development across their own areas, building a pipeline of expertise and next-generation leaders.\n\n\u2022 You make clear decisions on where in your practice areas to invest in capability and where not to."}}, {"name": "Supporting and Developing Others", "def": "How you support, develop and lead the people around you. Covers giving and receiving feedback, coaching and mentoring,  building autonomy and empowerment, and handling conflict.", "levels": {"6: Graduate": "\u2022 You give constructive feedback to colleagues, thinking about how it will be received by the other person.\n\n\u2022 You share what you're learning with colleagues and help colleagues with tasks you know how to complete.", "7: Junior": "\u2022 You give constructive feedback to colleagues, thinking about how it will be received by the other person.\n\n\u2022 You share what you're learning with colleagues and help colleagues with tasks you know how to complete.", "8: Mid": "\u2022 You give clear, specific constructive feedback that helps those around you improve their approach to work.\n\n\u2022 You are willing to give feedback upwards to more senior colleagues when it will help the work.", "9: Senior": "\u2022 You give colleagues the trust and space to deliver, stepping in where needed. \n\n\u2022 You recognise where others have individual strengths, and support and mentor them to engage meaningfully.\n\n\u2022 You recognise when colleagues can benefit and learn from each other, and give them the encouragement to connect.\n\n\u2022 You seek to understand how others are feeling and performing, and act to improve their situation.", "10: Lead": "\u2022 You build high-trust working environments, giving people the autonomy to deliver while staying close enough to unblock them.\n\n\u2022 You mentor and coach those around you, and you give constructive feedback that recognises good work and helps people see their own progress.\n\n\u2022 You identify sources of conflict early, bringing people together to surface and resolve issues openly so all parties feel heard before moving toward a resolution.\n\n\u2022 You seek to understand the underlying needs of others, holding trust and maintaining positive relationships while still achieving the right outcome.", "11: Principal": "\u2022 You build high-trust working environments across engagements, ensuring colleagues have the clarity and support to deliver.\n\n\u2022 You resolve conflict with empathy and directness, delivering difficult messages and bringing professional judgement to difficult situations.\n\n\u2022 You develop others through structured discussions, clear frameworks, and honest difficult conversations.\n\n\u2022 You remain pragmatic when colleagues face setbacks and keep them focused on what can move forward.\n\n\u2022 You recognise when it is important to get involved in people issues, understand what's at stake if you don't, and default to stepping in when it counts.", "12: Head of": "\u2022 You model how people are developed and how feedback is given, maintaining clear standards across your practice and addressing performance gaps constructively and in a timely way.\n\n\u2022 You handle the most complex people situations in your practice: organisational conflict, sensitive exits, and performance issues. You bring judgement and discretion to each.\n\n\u2022 You build the leadership capability of those below you, developing the next generation of leaders to meet future needs of the practice.\n\n\u2022 You demonstrate, encourage, and hold others accountable for the behaviours that create a culture of feedback, trust, and empowerment across your area."}}, {"name": "Communicating and Collaborating", "def": "How you build trust through communication and collaboration. Covers adapting how you communicate for different audiences, working openly across peers and disciplines, navigating stakeholder dynamics, and advocating for others.", "levels": {"6: Graduate": "\u2022 You communicate clearly with different audiences, adapting your language to suit who you are working with.\n\n\u2022 You build working relationships with others based on curiosity, reliability, and respect.\n\n\u2022 You build trust and credibility with peers by being reliable, contributing, and giving credit to others.\n\n\u2022 You collaborate openly rather than working in isolation, ask for help when you need it, and follow the lead from senior colleagues on how you work with others.", "7: Junior": "\u2022 You communicate clearly with different audiences, adapting your language to suit who you are working with.\n\n\u2022 You build working relationships with others based on curiosity, reliability, and respect.\n\n\u2022 You build trust and credibility with peers by being reliable, contributing, and giving credit to others.\n\n\u2022 You collaborate openly rather than working in isolation, ask for help when you need it, and follow the lead from senior colleagues on how you work with others.", "8: Mid": "\u2022 You tailor how you communicate with different stakeholders and clients, translating technical content into language that works for the audience.\n\n\u2022 You build trust in client situations through building credibility by demonstrating expertise, being consistent, and delivering on your commitments.\n\n\u2022 You collaborate across peers and disciplines, building your internal networks, knowing when to involve the right people, and recognising and acknowledging the value others contribute.\n\n\u2022 You recognise when you hold a different perspective to a stakeholder and check in with senior colleagues on how to raise it and whether it is important to raise.", "9: Senior": "\u2022 You bridge between technical work and client understanding, creating a common understanding that aids communication in multidisciplinary settings.\n\n\u2022 You build trust across the organisation and with clients through consistent delivery, clear communication, and a collaborative style.\n\n\u2022 You work in the open, welcome other views, and make it easy for others to contribute, creating a sense of psychological safety in the groups you're part of.\n\n\u2022 You identify where collaboration across disciplines would add value, exercising clear judgement on what to share, with whom, and at what moment, and you help colleagues understand what good looks like. \n\n\u2022 You recognise when stakeholders hold different perspectives to you, and discuss them to seek a solution, responding well to challenge in client sessions, delivering difficult messages with both honesty and a constructive tone.", "10: Lead": "\u2022 You frame and communicate work-related topics in ways that elevate its impact, connect delivery to the outcomes the client cares about.\n\n\u2022 You build and sustain relationships across the organisation and with clients.\n\n\u2022 You model supportive behaviour by welcoming other views, advocating for colleagues, and raising visibility of what they are achieving.\n\n\u2022 You manage senior stakeholder relationships, knowing when to speak, when to hold back, and when to bring others into the conversation.\n\n\u2022 You connect colleagues, clients, and leaders appropriately, so the right conversations happen at the right level.\n\n\u2022 You recognise when stakeholders hold different perspectives and you facilitate the conversation that gets them to a shared view on how to move forward.", "11: Principal": "\u2022 You represent the organisation and your practice effectively, shaping perspectives through clear, memorable stories, communicating key messages and adjusting your narrative for different audiences and contexts.\n\n\u2022 You represent your practice across the organisation and directly with clients, advocating for colleagues, and resetting boundaries without unnecessary escalation.\n\n\u2022 You represent the organisation credibly through the decisions you make and how you communicate them, the relationships you hold, and the outcomes you shape.\n\n\u2022 You set appropriate boundaries with clients, handle complex stakeholder dynamics, and build a network of trust across the organisation that your colleagues can access when needed.\n\n\u2022 You handle situations where stakeholders' interests and priorities differ, bringing people together around a shared view.", "12: Head of": "\u2022 You represent the practice as a lead voice, shaping perspectives through narratives you adapt across audiences and contexts.\n\n\u2022 You set the tone for how relationships are built and sustained across your practice area and with senior external stakeholders, creating a culture of safety and openness.\n\n\u2022 You shape the strategic narrative of your practice area: how it is understood internally, discussed with clients externally, and connected to the organisation's wider direction.\n\n\u2022 You lead the most challenging conversations, drawing on diverse inputs and signals to reset expectations, steer outcomes, and keep dynamics constructive without unnecessary escalation.\n\n\u2022 You handle situations where senior stakeholders' interests and priorities differ, bringing people together around a shared view, whilst ensuring good quality relationships are maintained."}}, {"name": "Owning and delivering", "def": "Taking responsibility for your work end-to-end and going beyond what was asked. Covers proactivity, adaptability and resourcefulness, managing scope and switching between contexts, spotting opportunities to add value", "levels": {"6: Graduate": "\u2022 You contribute to specialist tasks by working with more senior colleagues, and ask for help when you need it.\n\n\u2022 You manage your time and workload effectively, organising your diary and priorities, and consistently delivering to agreed deadlines and expected standards.\n\n\u2022 When you identify issues in your work, you raise them with senior colleagues.\n\n\u2022 You flag when you are at risk of missing a deadline early, keeping those affected informed.", "7: Junior": "\u2022 You contribute to specialist tasks by working with more senior colleagues, and ask for help when you need it.\n\n\u2022 You manage your time and workload effectively, organising your diary and priorities, and consistently delivering to agreed deadlines and expected standards.\n\n\u2022 When you identify issues in your work, you raise them with senior colleagues.\n\n\u2022 You flag when you are at risk of missing a deadline early, keeping those affected informed.", "8: Mid": "\u2022 You own individual specialist tasks within your workstream. You take on more challenging work and ask for input when you need it.\n\n\u2022 You understand how long elements of your work take, planning your work realistically.\n\n\u2022 You manage your time and resources to make consistent progress, and communicate status updates so others can make informed decisions. \n\n\u2022 When you identify issues in your work, you ensure they are flagged or corrected before the project is complete.\n\n\u2022 You context switch between tasks and contexts under guidance from colleagues, adjusting how you work when the client or project requires it.", "9: Senior": "\u2022 You support colleagues in areas where they have less familiarity, helping them get up to speed on the work.\n\n\u2022 You recognise obstacles and blockers, mitigate the risks they create, and escalate the important ones to the relevant individuals.\n\n\u2022 You spot opportunities to add value beyond the current scope, either through delivery or by feeding insights back to the relevant people.\n\n\u2022 You accurately assess the time and effort a piece of work requires, and realistically evaluate your own capacity before committing.\n\n\u2022 You manage your own energy and communicate how you best work, being able to switch contexts and maintain sustainable ways of operating.", "10: Lead": "\u2022 You lead by example in how tasks are planned and delivered, testing ideas to validate them and demonstrating value early.\n\n\u2022 You model how to share what you're working on, your availability, and how you balance competing demands.\n\n\u2022 You identify where you can add value beyond the current scope, and you model this for others.\n\n\u2022 You respond to the needs of others and help to unblock the challenges they face, recognising when information needs to be escalated to senior colleagues.", "11: Principal": "\u2022 You reliably meet your commitments across all tasks and projects assigned to you, setting the example for how to plan, deliver, and review work to meet client expectations.\n\n\u2022 You manage your time and energy across your work, maintaining consistent output without compromising your own effectiveness.\n\n\u2022 You look ahead to anticipate challenges across your workload, and you address them before they become issues for your colleagues.\n\n\u2022 You are alert to resource constraints, manage the risks they create, and know when to escalate these\n\n\u2022 You switch credibly between client work, internal initiatives, and bids, holding multiple types of work with the ability to get back up to speed quickly on each of them.", "12: Head of": "\u2022 You hold your practice to a consistent standard for planning, delivery and quality, intervening visibly when work drifts and articulating what 'good' looks like.\n\n\u2022 You define and communicate the principles, escalation paths and decision rights that govern how your practice operates, and ensure colleagues apply them consistently in their day-to-day work.\n\n\u2022 You make clear decisions on scope and resource across the practice, naming the trade-offs between utilisation, development and delivery risks\n\n\u2022 You anticipate resource constraints and act on them ahead of time, reallocating, renegotiating or escalating before it becomes a delivery risk."}}, {"name": "Navigating scope and complexity", "def": "How you make sense of complexity, manage scope and shape direction. Covers strategic thinking, navigating ambiguity, connecting delivery decisions to broader outcomes, and managing scope change.", "levels": {"6: Graduate": "\u2022 You stay curious about complexity and take interest in how things connect.\n\n\u2022 You flag when information is unclear or incomplete, asking questions to clarify what you need before continuing.", "7: Junior": "\u2022 You stay curious about complexity and take interest in how things connect.\n\n\u2022 You flag when information is unclear or incomplete, asking questions to clarify what you need before continuing.", "8: Mid": "\u2022 You keep making progress when it is not clear what you're working to resolve, identifying open questions rather than forcing premature answers.\n\n\u2022 You work with the team to break ambiguous problems into smaller parts and make progress on what you can, asking for support when needed.\n\n\u2022 You raise potential project scope creep early, renegotiating deadlines with project leads when appropriate.\n\n\u2022 You identify patterns across your work, recognising when a challenge you've seen before is appearing in a new context, and you apply what you've learned.\n\n\u2022 You understand how your work connects to the broader project or programme goals.", "9: Senior": "\u2022 You work through ambiguous problems by structuring them, laying out options, trade-offs, and a recommended path with incomplete information.\n\n\u2022 You spot issues early and escalate them in time for others to act, and you help teammates work through their own escalations.\n\n\u2022 You understand what good outcomes look like at the end of the engagement, connecting delivery decisions back to the client's wider outcomes.\n\n\u2022 You make sound decisions under pressure with incomplete information.\n\n\u2022 You set boundaries and prioritise with judgement, knowing what's in scope, what isn't, and what to say no to.\n\n\u2022 You support colleagues through specialist tasks, helping them see how their work ties to wider project and organisational objectives.", "10: Lead": "\u2022 You remain composed when an engagement becomes complex or unclear, bringing clarity and structure by committing to a path with incomplete information and adjusting as more becomes clear.\n\n\u2022 You connect delivery decisions to the broader outcomes of the engagement, articulating how each decision contributes to achieving the client's goals.\n\n\u2022 You set boundaries that are realistic to deliver against, and manage the scope of the engagement in spite of pressure to change it.\n\n\u2022 You shape scope on engagements and protect the focus of those delivering, declining low-value requests and absorbing the ones that matter.\n\n\u2022 You support others in discussions around negotiating trade-offs with the client openly, having open dialogue about what would need to be compromised if something new is added or changed.", "11: Principal": "\u2022 You hold complexity across your work, tracing cause and effect, triaging incoming information, and managing risk.\n\n\u2022 You set strategic direction in ambiguous situations, clarifying ill-defined or complex problems and making decisions so that work can progress\n\n\u2022 You connect delivery decisions to the client's strategic and commercial outcomes, ensuring choices made serve the broader value the client is seeking.\n\n\u2022 You make sound decisions when information is incomplete and a decision is needed, and colleagues seek you out for your judgement in high-stakes situations.\n\n\u2022 You make the decisions on how scope is shaped across the projects you oversee, balancing the client's request with what can realistically be delivered well.\n\n\u2022 You shield colleagues from organisational noise so they can focus on the work that matters.", "12: Head of": "\u2022 You make high-stakes decisions where information is incomplete and the stakes are significant, and you stand behind those decisions.\n\n\u2022 You define the approach the practice takes to understand the opportunities and challenges a certain engagement presents, informing the ultimate approach taken.\n\n\u2022 You give others clear visibility of your team's priorities and strategic direction, and make course corrections to colleagues' approaches as needed.\n\n\u2022 You identify how current challenges and opportunities can unlock value for your practice area, and you act to meet them, through capability, resourcing, or commercial moves."}}], "levels": ["6: Graduate", "7: Junior", "8: Mid", "9: Senior", "10: Lead", "11: Principal"]};
const EXAMPLES = {"Software Engineer|8: Mid": {"s:Information security": {"examples": ["When adding file upload to a council's planning portal, you spot the risk of malicious files and suggest virus scanning and file-type checks before it goes to review.", "In a pull request you notice secrets in a config file, explain why they belong in the secrets manager, and point to the fix."], "actions": ["Run a lightweight threat model on the feature you're building and share it with your tech lead.", "Check your current codebase against three of the OWASP Top 10 risks."], "resource": {"title": "OWASP Top 10", "by": "OWASP Foundation", "url": "https://owasp.org/www-project-top-ten/"}, "obj": ["When we added file upload to the planning portal, I flagged the risk of malicious files and added virus scanning and file-type checks. It passed the security review first time."]}, "s:Systems design": {"examples": ["You take the architect's logical design for a booking service and turn it into a physical one: which services, which database, how they talk, documented in the repo.", "Before building a new notification feature you write a short design doc with a sequence diagram and get two engineers to review it."], "actions": ["Write a one-page design doc for your next story that's bigger than three days, and ask a senior engineer to review it.", "Document one existing component using the C4 model."], "resource": {"title": "Designing Data-Intensive Applications", "by": "Martin Kleppmann (book)"}, "obj": ["I took the architect's logical design for the booking service and chose the services, database and queues to build it, then got it signed off before coding.", "I wrote a detailed design for the notifications feature, with data flows and error handling, which the team built from with no major rework.", "I documented the payments integration in the repo using C4 diagrams and an architecture decision record, so a new joiner could pick it up in a day.", "I designed the reporting export to run off a read replica, keeping risk to the live service low while still meeting the client's monthly reporting need.", "I chose a standard queue-and-worker pattern for bulk emails instead of something bespoke, which kept it simple and easy for the client's team to support."]}, "b:Communicating and Collaborating": {"examples": ["At show and tell you explain an API change in terms of what caseworkers will see, not which endpoints moved.", "You notice the designer's prototype needs data the backend doesn't have, and set up a 15-minute chat instead of leaving a comment on a ticket."], "actions": ["Present your team's work at the next show and tell, pitched at the non-technical people in the room.", "Pair with a designer or user researcher for an afternoon."], "resource": {"title": "The Pyramid Principle", "by": "Barbara Minto (book)"}, "obj": ["At show and tell I explained the API change in terms of what caseworkers would see, and the service owner said it was the first time it had clicked.", "I committed to fixing a data bug before the client's board meeting, did it, and kept them updated daily. They now come to me directly with technical questions.", "I spotted that the designer's prototype needed data we didn't hold, pulled in the data engineer early, and credited both of them in the sprint review.", "I disagreed with the client's choice of reporting tool, checked with my tech lead how to raise it, and we presented the trade-offs together."]}, "b:Navigating scope and complexity": {"examples": ["Given a vague story to 'improve search', you list the open questions, agree a first small slice with the product manager, and ship it while the rest gets clarified.", "You spot that a 'small tweak' touches three services and flag it at stand-up the same day, before it derails the sprint."], "actions": ["Next time you pick up an unclear story, write down the open questions and agree a first slice before you start coding.", "Raise any scope change at stand-up within a day of spotting it."], "resource": {"title": "Shape Up", "by": "Ryan Singer, Basecamp (free online book)", "url": "https://basecamp.com/shapeup"}, "obj": ["Given a vague story to 'improve search', I listed the open questions, agreed a first slice with the product manager and shipped that while the rest was clarified.", "I broke a messy data migration into five smaller steps with the team, delivered the first two, and asked the tech lead for help with the risky third.", "When a 'small tweak' turned out to touch three services, I raised it at stand-up that day and we moved the deadline by a sprint rather than rushing it.", "I recognised a caching problem I'd fixed on a previous project and applied the same approach, which saved the team about a week.", "I explained to a newer engineer how our API work supports the council's goal of reducing phone calls, so they could prioritise sensibly."]}, "s:Availability, robustness and capacity management": {"examples": ["You notice response times creeping up before a benefits deadline, find the slow query, and propose a fix and a load test before users feel it."], "actions": ["Set up or improve an alert on one key service metric for your project.", "Run a load test on your service and share what you'd change."], "resource": {"title": "AWS Well-Architected Framework", "by": "Amazon Web Services", "url": "https://aws.amazon.com/architecture/well-architected/"}, "obj": ["I set up health checks and dashboards across all five services before go-live, so we could see and fix problems before users reported them.", "I introduced a checklist for deployments and incident handling, and got the team to use it consistently. Failed releases dropped noticeably.", "Load testing showed the service would struggle at the benefits deadline, so I made the case for scaling the database and got it done in time.", "When error rates spiked after a release, I rolled back, found the cause and wrote up what we'd change, all within the same afternoon.", "In design reviews I suggested well-architected improvements such as autoscaling and retries, and two were adopted."]}, "s:Modern standards approach": {"examples": ["You help your team make the repo ready to be coded in the open, walking a junior colleague through what that involves and why it matters."], "actions": ["Pick one point of the Technology Code of Practice and show your team how your project meets it.", "Pair with a junior engineer on applying a standard, such as accessibility or open code, to their story."], "resource": {"title": "Technology Code of Practice", "by": "Central Digital and Data Office", "url": "https://www.gov.uk/guidance/the-technology-code-of-practice"}, "obj": ["I led the work to make our repo ready to code in the open and paired with a junior engineer so she could do the next one herself."]}, "s:Prototyping": {"examples": ["You run a one-day spike with the designer, building two throwaway prototypes to test with users before the team commits to an approach."], "actions": ["Suggest and run a time-boxed spike on your team's riskiest assumption.", "Try a prototyping method you haven't used before and share what you learned."], "resource": {"title": "GOV.UK Service Manual: making prototypes", "by": "Government Digital Service", "url": "https://www.gov.uk/service-manual"}, "obj": ["I ran a one-day spike with the designer and researcher to test two approaches with users, instead of prototyping on my own.", "I turned our prototype components into a small reusable pattern library and refined it after each round of user testing.", "I used a paper prototype for an early workflow idea and a coded prototype for the tricky interactions, choosing each for what we needed to learn."]}, "s:User focus": {"examples": ["In sprint planning you push back on a feature request by pointing to what users said in research, and suggest a smaller change that meets the real need."], "actions": ["Observe two user research sessions this quarter and share one insight at stand-up.", "Add a 'user need' line to the next three stories you refine."], "resource": {"title": "GOV.UK Service Manual: user research", "by": "Government Digital Service", "url": "https://www.gov.uk/service-manual"}, "obj": ["I joined four user research sessions and worked with the researcher to make sure technical constraints were understood before we wrote stories.", "When the client asked for a dashboard, I pointed to research showing users actually needed a weekly email, and we built that instead.", "I pushed for research with screen reader users, which uncovered two blockers we fixed before launch.", "I helped the team agree how we'd validate each story with users, and coached a junior engineer on writing user-focused acceptance criteria.", "I recommended moving from ad-hoc surveys to short moderated sessions for technical features, which gave us much clearer answers."]}, "b:Developing your craft": {"examples": ["You write up a tricky database migration on the internal wiki, so colleagues know what you learned and when to bring you in."], "actions": ["Write up something you've learned on a project and share it with your practice.", "Ask two colleagues for targeted feedback on one skill you're building."], "resource": {"title": "The Pragmatic Programmer", "by": "David Thomas and Andrew Hunt (book)"}, "obj": ["I asked my tech lead and a senior engineer for specific feedback on my system designs, and changed how I document trade-offs as a result.", "Knowing security was a gap, I paired with our security specialist for a sprint and ran my first threat model with her support.", "I wrote up our database migration approach on the wiki and presented it at the engineering show and tell, and two teams have since asked me to help.", "I ran a lunch-and-learn on contract testing and shared a starter template the practice now uses on new projects."]}}};

let sound = true; try{ sound = localStorage.getItem(SOUNDKEY) !== "off"; }catch(e){}

// ---------- 8-bit sound ----------
let AC = null;
function note(freq, start, dur, type="square", vol=.06){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime + start; o.start(t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur); o.stop(t+dur+.02);
  }catch(e){}
}

const PAL = {H:"#7E2553",S:"#FFCCAA",K:"#1D2B53",B:"#29ADFF",P:"#1D2B53",R:"#FF004D",Y:"#FFEC27",W:"#FFF1E8",G:"#5F574F",L:"#C2C3C7"};
function pixelSvg(rows, cls=""){
  const h = rows.length, w = rows[0].length; let r = "";
  rows.forEach((row,y) => [...row].forEach((c,x) => { if(PAL[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`; }));
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="100%" height="100%" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const HERO = ["....HHHH....","...HHHHHH...","..HHSSSSHH..","..HSKSSKSH..","..HSSSSSSH..","...SSRRSS...","....SSSS....","..BBBBBBBB..",".SBBBYYBBBS.",".SBBBBBBBBS.","...PPPPPP...","...PP..PP...","...PP..PP...","..KKK..KKK.."];
const CASTLE = ["L.L.L....L.L.L","LLLLL....LLLLL",".LLL......LLL.",".LLLL.LL.LLLL.",".LLLLLLLLLLLL.",".LLLLLLLLLLLL.",".LLLLGGGGLLLL.",".LLLGGGGGGLLL.",".LLLGGGGGGLLL.",".LLLGGGGGGLLL."];

// ---------- Framework ----------
function items(){
  const r = findRole(A.role), i = FW.levels.indexOf(A.level);
  const nextJob = JOB_LEVELS[JOB_LEVELS.indexOf(A.level)+1] || null;
  const sk = r.skills.filter(s => isDef(s.levels[i])).map(s => {
    const next = isDef(s.levels[i+1]) ? s.levels[i+1] : null;
    return {key:"s:"+s.skill, kind:"Skill", name:s.skill, required:s.levels[i], next, nextJob,
      now: bullets(skillDef(s.skill)[s.levels[i]]), nextText: next && next!==s.levels[i] ? bullets(skillDef(s.skill)[next]) : []};
  });
  const bh = FW.behaviours.map(b => ({key:"b:"+b.name, kind:"Behaviour", name:b.name, required:A.level, nextJob,
      now: bullets(b.levels[A.level]), nextText: nextJob ? bullets(b.levels[nextJob]) : []}));
  return sk.concat(bh);
}
const avg = xs => { const p = xs.map(x=>POINTS[A.ratings[x.key]]).filter(Boolean); return p.length ? p.reduce((a,b)=>a+b,0)/p.length : null; };
const label = v => v==null ? null : v<3 ? "Partially Met" : v<3.75 ? "Met" : "Exceeding";
function contentFor(it){
  const hand = (EXAMPLES[A.role+"|"+A.level] || {})[it.key];
  return hand || AI[it.key] || null;
}
function fallbackActions(it){
  const stretch = A.ratings[it.key]==="Met";
  const src = stretch && it.nextText.length ? it.nextText : (it.now.length ? it.now : it.nextText);
  return src.slice(0,2).map(t => "On your current engagement, look for a chance to " + t.charAt(0).toLowerCase() + t.slice(1).replace(/\.$/,"") + ".");
}
const questsFor = it => (A.ratings[it.key]==="Met" && it.nextText.length) ? it.nextText : it.now;
const noteOf = id => ((A.notes||{})[id]||"").trim();
const bosses = () => items().filter(i=>A.ratings[i.key]==="Partially Met");
const bonuses = () => items().filter(i=>A.ratings[i.key]==="Met");

// ---------- Game state ----------
const RANKS = [[0,"Rookie"],[100,"Apprentice"],[300,"Adventurer"],[550,"Hero"]];
const ACH = [
  {id:"ready", ico:"1P", name:"Player one ready", test:g=>g.done>=1},
  {id:"clear", ico:"★", name:"Level clear", test:g=>g.cleared>=1},
  {id:"block", ico:"?", name:"Lucky block", test:()=> (A.blocks||0)>=1},
  {id:"notes", ico:"✎", name:"Record keeper", test:g=>g.notes>=3},
  {id:"check", ico:"½", name:"Checkpoint", test:g=>g.total && g.done*2>=g.total},
  {id:"bonus", ico:"+", name:"Bonus stage", test:g=>g.bonusCleared>=1},
  {id:"final", ico:"♛", name:"Final boss beaten", test:g=>g.total && g.done===g.total}
];
function game(){
  const bs = bosses(); let total=0, done=0, cleared=0;
  const per = bs.map(it => { const q = questsFor(it); const d = q.filter((_,i)=>A.done[it.key+"#"+i]).length; total+=q.length; done+=d; if(q.length && d===q.length) cleared++; return {it,d,n:q.length}; });
  let bdone=0, btotal=0, bonusCleared=0;
  const bper = bonuses().map(it => { const q = questsFor(it); const d = q.filter((_,i)=>A.done[it.key+"#"+i]).length; btotal+=q.length; bdone+=d; if(q.length && d===q.length) bonusCleared++; return {it,d,n:q.length}; });
  const notes = Object.keys(A.notes||{}).filter(k=>noteOf(k)).length;
  const xp = (done+bdone)*50 + (cleared+bonusCleared)*100 + notes*25, max = (total+btotal)*75 + (bs.length+bper.length)*100;
  let lv = 1, rank = RANKS[0][1], base = 0, next = RANKS[1][0];
  RANKS.forEach(([at,name],i) => { if(xp>=at){ lv=i+1; rank=name; base=at; next = RANKS[i+1] ? Math.min(RANKS[i+1][0], max) : max; } });
  const legend = total && done===total;
  if(legend){ lv = RANKS.length+1; rank = "Legend"; base = max; next = max; }
  return {bs, per, bper, total, done, cleared, bonusCleared, notes, xp, max, lv, rank, base, next, legend};
}

function readFile(f){
  const st = $("#status"); st.className = "status"; st.textContent = "Loading " + f.name + "…";
  if(typeof XLSX === "undefined"){ st.className="status err"; st.textContent="The spreadsheet reader didn't load. Check your connection and reload the page."; return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), {type:"array"});
      const ws = wb.Sheets["Your self assessment"];
      if(!ws) throw new Error("This file has no 'Your self assessment' tab. Use the Progression Assessment 2026 template.");
      const v = a => { const c = ws[a]; return c ? String(c.w ?? c.v ?? "").trim() : ""; };
      const role = findRole(v("G6"));
      if(!role) throw new Error(`The job role in cell G6 ("${v("G6")||"blank"}") isn't in the 2026 framework.`);
      let name = v("G3"); if(/enter your name|^your name$/i.test(name)) name = "";
      const a = {name, role:role.role, practice:role.practice, level:v("G7"), ratings:{}, evidence:{}, done:{}, sample:false};
      const norm = r => RATINGS.find(x => x.toLowerCase() === r.toLowerCase());
      let n = 0;
      [[31,39,"s:"],[47,51,"b:"]].forEach(([from,to,p]) => { for(let r=from;r<=to;r++){ const nm=v("B"+r); if(!nm) continue; const rt=norm(v("J"+r)); if(rt){a.ratings[p+nm]=rt; n++;} if(v("G"+r)) a.evidence[p+nm]=v("G"+r); } });
      if(!n) throw new Error("This assessment has no ratings yet. Fill in 'Your working level' for each skill and behaviour, then load it again.");
      a.notes = {}; A = a; save(); SFX.coin(); vGame();
    }catch(err){ st.className = "status err"; st.textContent = err.message; }
  };
  fr.readAsArrayBuffer(f);
}

let lastLv = null, lastAch = null;
function updateHUD(initial){
  const g = game();
  const r = $("#rank"); if(!r) return;
  r.textContent = `LV ${g.lv} ${g.rank}`;
  const span = Math.max(1, g.next - g.base), frac = g.legend ? 1 : Math.min(1,(g.xp-g.base)/span);
  const segs = 12, on = Math.round(frac*segs);
  $("#xpbar").innerHTML = Array.from({length:segs},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  const nr = RANKS.find(([at])=>at>g.xp);
  $("#xptext").textContent = g.legend ? `${g.xp} XP. Every boss beaten.` : nr && nr[0] <= g.max ? `${g.xp} XP, ${nr[0]-g.xp} to ${nr[1]}` : `${g.xp} XP, ${g.max-g.xp} to Legend`;
  // world
  const sp = $("#sprite");
  if(sp){
    const n = g.bs.length; let pos = 0;
    g.per.forEach(p => { if(p.n && p.d===p.n) pos++; });
    let partial = 0; const cur = g.per.find(p => !(p.n && p.d===p.n)); if(cur && cur.n) partial = cur.d/cur.n * .5;
    const frac2 = g.legend ? 1 : (pos + partial)/(n+1);
    sp.style.left = `calc(${frac2*100}% * (1 - 90/560) + 45px * 1)`;
    sp.style.left = `calc(45px + (100% - 90px) * ${frac2})`;
    g.per.forEach(p => { const nd = document.querySelector(`.node[data-goto="${CSS.escape(p.it.key)}"]`); if(nd) nd.classList.toggle("clear", p.n && p.d===p.n); });
  }
  const got = ACH.filter(a=>a.test(g)).map(a=>a.id);
  const ach = $("#ach");
  if(ach) ach.innerHTML = `<span class="px" style="font-size:.55rem;width:100%;color:var(--ink-2)">ACHIEVEMENTS ${got.length}/${ACH.length}</span>` + ACH.map(a=>`<span class="ach ${got.includes(a.id)?"on":""}"><span class="ico" aria-hidden="true">${a.ico}</span>${esc(a.name)}</span>`).join("");
  if(!initial){
    const fresh = got.filter(id => !(lastAch||[]).includes(id));
    if(lastLv!=null && g.lv > lastLv) levelUp(g.rank, g.lv, g.legend);
    else if(fresh.length){ toast("ACHIEVEMENT UNLOCKED", ACH.find(a=>a.id===fresh[0]).name); SFX.ach(); }
  }
  lastLv = g.lv; lastAch = got;
}
function levelUp(rank, lv, legend){
  SFX.levelup();
  if(reduced()){ toast(legend?"YOU WIN":"LEVEL UP", `LV ${lv} ${rank}`); return; }
  const el = document.createElement("div"); el.className="levelup"; el.setAttribute("role","status");
  el.innerHTML = `<div>${legend?"YOU WIN!":"LEVEL UP!"}<small>LV ${lv} ${esc(rank)}</small></div>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2100);
}
function toast(head, msg){
  let t = $("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = `<span class="px">${esc(head)}</span>${esc(msg)}`; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}
function burst(el){
  if(reduced()) return;
  const b = document.createElement("span"); b.className="burst";
  const cols = ["#FFEC27","#FF004D","#29ADFF","#00E436"];
  for(let i=0;i<12;i++){ const s=document.createElement("i"); const a=i/12*Math.PI*2, d=26+(i%3)*12;
    s.style.setProperty("--x",Math.round(Math.cos(a)*d/4)*4+"px"); s.style.setProperty("--y",Math.round(Math.sin(a)*d/4)*4+"px"); s.style.background=cols[i%4]; b.appendChild(s); }
  el.appendChild(b); setTimeout(()=>b.remove(), 700);
}
function flash(el){ el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1400); }
function goTo(key){ const c = document.querySelector(`[data-cardkey="${CSS.escape(key)}"]`); if(c){ if(c.tagName==="DETAILS") c.open = true; c.scrollIntoView({behavior: reduced()?"auto":"smooth", block:"start"}); flash(c); } }

function wire(){
  document.querySelectorAll("[data-q]").forEach(cb => cb.onchange = () => {
    if(cb.checked) A.done[cb.dataset.q] = true; else delete A.done[cb.dataset.q];
    save();
    const lab = cb.closest(".quest"); lab.classList.toggle("done", cb.checked);
    const card = cb.closest("[data-cardkey]"), it = items().find(i=>i.key===cb.dataset.card), q = questsFor(it);
    const d = q.filter((_,i)=>A.done[it.key+"#"+i]).length, cleared = d===q.length;
    card.querySelectorAll(".hpbar i").forEach((seg,i)=>seg.classList.toggle("gone", i<d));
    const hn = card.querySelector(".hpnum"); if(hn) hn.textContent = `${q.length-d}/${q.length}`;
    card.querySelectorAll(".stars i").forEach((s,i)=>s.classList.toggle("on", i<d));
    const was = card.classList.contains("cleared");
    card.classList.toggle("cleared", cleared);
    if(cb.checked){ burst(lab); if(cleared && !was) SFX.clear(); else SFX.tick(); } else SFX.untick();
    updateHUD(false);
  });
  document.querySelectorAll("[data-tip]").forEach(b => b.onclick = () => anotherTip(b.dataset.tip, b));
  document.querySelectorAll("[data-note]").forEach(ta => {
    ta.oninput = () => { A.notes = A.notes || {}; A.notes[ta.dataset.note] = ta.value; clearTimeout(ta._t); ta._t = setTimeout(save, 400); };
    ta.onchange = () => {
      save();
      const had = ta.dataset.had === "1", has = !!ta.value.trim();
      ta.closest(".note").querySelector("summary").firstChild.textContent = has ? "Evidence noted " : "Add evidence ";
      const it = items().find(i=>i.key===ta.dataset.card); const c = document.querySelector(`[data-evcount="${CSS.escape(it.key)}"]`); if(c) c.textContent = evCount(it);
      if(has && !had) SFX.tick(); ta.dataset.had = has ? "1" : "0";
      updateHUD(false);
    };
    ta.dataset.had = ta.value.trim() ? "1" : "0";
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyEvidence(evidenceText(items().find(i=>i.key===b.dataset.copy)), b));
  const ca = $("#copyall"); if(ca) ca.onclick = () => copyEvidence(bosses().concat(bonuses()).map(evidenceText).join("\n\n"), ca);
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => goTo(b.dataset.goto));
  const qb = $("#qblock"); if(qb) qb.onclick = hitBlock;
}
async function anotherTip(key, btn){
  const it = items().find(i=>i.key===key), c = contentFor(it); if(!c) return;
  const el = document.getElementById("tip-"+cssId(key));
  const next = (EXI[key]||0) + 1;
  if(next >= c.examples.length && SAMPLE){
    btn.disabled = true; btn.textContent = "Loading…";
    try{
      const r = await SAMPLE(`Write ONE new, concrete, realistic example (under 40 words, second person, present tense, British English) of a ${short(A.level)} ${A.role} at TPXimpact, a UK digital transformation consultancy, showing this on a real client engagement: ${it.now.join(" / ")}. Make it different from these: ${c.examples.join(" | ")}. Reply with the example only.`, {modelTier:"quick", cache:false});
      const txt = (r.text||"").trim().replace(/^"|"$/g,""); if(txt) c.examples.push(txt);
    }catch(e){}
    btn.disabled = false; btn.textContent = "Another example";
  }
  EXI[key] = next % c.examples.length;
  el.textContent = c.examples[EXI[key]];
  A.tips = (A.tips||0) + 1; save(); SFX.bump(); updateHUD(false);
}
function hitBlock(){
  const qb = $("#qblock"), pop = $("#pop");
  qb.classList.remove("bump"); void qb.offsetWidth; qb.classList.add("bump");
  if(!reduced()){ const c = document.createElement("span"); c.className="coin"; qb.appendChild(c); setTimeout(()=>c.remove(), 650); }
  SFX.coin();
  const open = [];
  bosses().forEach(it => questsFor(it).forEach((a,i) => { if(!A.done[it.key+"#"+i]) open.push({it,a}); }));
  if(!open.length) bonuses().forEach(it => questsFor(it).forEach((a,i) => { if(!A.done[it.key+"#"+i]) open.push({it,a,bonus:true}); }));
  if(!open.length){ pop.innerHTML = `<div class="px">EMPTY BLOCK</div><p>Every objective is done. Take this to your next one-to-one.</p>`; pop.classList.add("show"); return; }
  const pick = open[Math.floor(Math.random()*open.length)];
  A.blocks = (A.blocks||0) + 1; save();
  pop.innerHTML = `<div class="px">TODAY'S OBJECTIVE: +50 XP</div><p>${esc(pick.a)}</p><div class="from" style="margin-bottom:4px">Look for a chance to show this on your work this week.</div><div class="from">From ${pick.bonus?"bonus stage":"level"}: ${esc(pick.it.name)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pbtn small" id="goq" style="background:#FFEC27;color:#1D2B53;box-shadow:0 0 0 4px #FFEC27">Go to level</button><button class="pbtn alt small" id="againq">Hit again</button></div>`;
  pop.classList.add("show");
  $("#goq").onclick = () => goTo(pick.it.key);
  $("#againq").onclick = () => { window.scrollTo({top: qb.getBoundingClientRect().top + window.scrollY - 120, behavior: reduced()?"auto":"smooth"}); hitBlock(); };
  updateHUD(false);
}

// ---------- Deadline Dash: bonus endless runner ----------
const DASHKEY = "levelup-dash-best";
let dashRAF = null;
function stopDash(){ if(dashRAF){ cancelAnimationFrame(dashRAF); dashRAF = null; } window.removeEventListener("keydown", dashKey); }
let dashKey = () => {};
function vDash(){
  stopDash();
  let best = 0; try{ best = +localStorage.getItem(DASHKEY) || 0; }catch(e){}
  $("#barRight").innerHTML = soundBtn() + `<button class="pbtn alt small" id="backLv">Back to levels</button>`;
  wireSound();
  $("#backLv").onclick = () => { stopDash(); vGame(); };
  $("#main").innerHTML = `
    <div class="dash-top"><div><div class="p1">BONUS ROUND</div><h1>Deadline Dash</h1></div>
      <div class="stat">BEST <b id="dbest">${best}</b></div></div>
    <div class="frame dash-wrap"><canvas id="dash" width="800" height="260" role="img" aria-label="Deadline Dash game. Press space or tap to jump."></canvas></div>
    <p class="dash-help">Press <b>Space</b> or <b>Up</b>, or tap the game, to jump. Dodge the workday blockers and grab coins. Just for fun: this doesn't change your assessment XP.</p>`;
  window.scrollTo(0,0);
  const cv = $("#dash"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  const Wd = 800, Hd = 260, GROUND = 210, PX = 4;
  const dark = () => matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
  const OBS = [
    {label:"Scope creep", w:34, h:40, c:"#FF004D"},
    {label:"Merge conflict", w:26, h:52, c:"#7E2553"},
    {label:"Surprise meeting", w:44, h:30, c:"#29ADFF"},
    {label:"Flaky test", w:22, h:34, c:"#FFA300"},
    {label:"Unclear story", w:30, h:46, c:"#008751"},
    {label:"Friday deploy", w:40, h:36, c:"#AB5236"}
  ];
  const runA = HERO.slice(0,11).concat(["...PP..PP...","..PP....PP..","..KK....KK.."]);
  const runB = HERO.slice(0,11).concat(["....PPPP....","....PP.PP...","...KK..KK..."]);
  let st;
  function reset(){ st = {y:0, vy:0, t:0, speed:6, obs:[], coins:[], score:0, coinN:0, next:60, nextCoin:120, over:false, started:false, frame:0}; }
  reset();
  function jump(){
    if(st.over){ reset(); st.started = true; SFX.coin(); return; }
    if(!st.started){ st.started = true; }
    if(st.y === 0){ st.vy = 13.5; note(523,0,.06); note(784,.05,.08); }
  }
  dashKey = e => { if(e.code==="Space" || e.code==="ArrowUp"){ e.preventDefault(); jump(); } };
  window.addEventListener("keydown", dashKey);
  cv.addEventListener("pointerdown", e => { e.preventDefault(); jump(); });

  function sprite(rows, x, y, scale){ rows.forEach((row,ry) => [...row].forEach((ch,rx) => { if(PAL[ch]){ g.fillStyle = PAL[ch]; g.fillRect(Math.round(x+rx*scale), Math.round(y+ry*scale), scale, scale); } })); }
  function text(s, x, y, size, color, align="left"){ g.font = `${size}px "Press Start 2P", monospace`; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y); }
  function step(){
    const ink = dark() ? "#FFF1E8" : "#1D2B53", bg = dark() ? "#1D2B53" : "#FFF1E8";
    cv.style.background = bg;
    g.fillStyle = bg; g.fillRect(0,0,Wd,Hd);
    // skyline clouds
    g.fillStyle = dark() ? "#26366A" : "#F3E3D6";
    for(let i=0;i<4;i++){ const cx = ((i*230 - st.t*0.6) % 920 + 920) % 920 - 60; g.fillRect(cx, 40+i%2*30, 64, 12); g.fillRect(cx+12, 28+i%2*30, 36, 12); }
    // ground
    g.fillStyle = "#008751"; g.fillRect(0, GROUND, Wd, 8);
    g.fillStyle = "#005f39"; for(let x = -((st.t*st.speed)%24); x < Wd; x += 24) g.fillRect(x, GROUND, 12, 8);
    g.fillStyle = dark() ? "#3B4A7A" : "#E8D5C4"; for(let x = -((st.t*st.speed*.5)%40); x < Wd; x += 40) g.fillRect(x, GROUND+22, 8, 4);

    if(st.started && !st.over){
      st.t++; st.frame++;
      st.speed = Math.min(14, 6 + st.t/600);
      st.score = Math.floor(st.t/6) + st.coinN*10;
      // physics
      st.vy -= 0.75; st.y = Math.max(0, st.y + st.vy); if(st.y===0) st.vy = 0;
      // spawn
      if(--st.next <= 0){ const o = OBS[Math.floor(Math.random()*OBS.length)]; st.obs.push({...o, x:Wd+10}); st.next = 55 + Math.floor(Math.random()*60) - Math.min(25, st.t/200); }
      if(--st.nextCoin <= 0){ st.coins.push({x:Wd+10, y: 60 + Math.random()*60}); st.nextCoin = 90 + Math.floor(Math.random()*120); }
      st.obs.forEach(o => o.x -= st.speed); st.coins.forEach(c => c.x -= st.speed);
      st.obs = st.obs.filter(o => o.x > -80); st.coins = st.coins.filter(c => c.x > -30 && !c.got);
      // collisions (hitbox slightly smaller than sprite)
      const px = 80+8, pw = 12*PX-16, py = GROUND - 14*PX - st.y + 6, ph = 14*PX-6;
      for(const o of st.obs){ if(px < o.x+o.w && px+pw > o.x && py+ph > GROUND-o.h){ st.over = true; note(220,0,.15,"sawtooth",.07); note(130,.12,.3,"sawtooth",.07);
        let best = 0; try{ best = +localStorage.getItem(DASHKEY)||0; if(st.score > best){ localStorage.setItem(DASHKEY, st.score); $("#dbest").textContent = st.score; } }catch(e){} } }
      for(const c of st.coins){ if(px < c.x+16 && px+pw > c.x && py < c.y+20 && py+ph > c.y){ c.got = true; st.coinN++; SFX.coin(); } }
    }
    // obstacles
    st.obs.forEach(o => {
      g.fillStyle = o.c; g.fillRect(Math.round(o.x), GROUND-o.h, o.w, o.h);
      g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(Math.round(o.x)+o.w-4, GROUND-o.h, 4, o.h); g.fillRect(Math.round(o.x), GROUND-4, o.w, 4);
      g.fillStyle = "#FFF1E8"; g.fillRect(Math.round(o.x)+6, GROUND-o.h+8, 4, 4); g.fillRect(Math.round(o.x)+o.w-14, GROUND-o.h+8, 4, 4);
      text(o.label, o.x + o.w/2, GROUND-o.h-10, 8, ink, "center");
    });
    // coins
    st.coins.forEach(c => { g.fillStyle = "#1D2B53"; g.fillRect(c.x-2, c.y-2, 20, 24); g.fillStyle = "#FFEC27"; g.fillRect(c.x, c.y, 16, 20); g.fillStyle = "#FFA300"; g.fillRect(c.x+12, c.y, 4, 20); g.fillRect(c.x+6, c.y+4, 4, 12); });
    // player
    const rows = st.y > 0 || !st.started ? HERO : (Math.floor(st.frame/6)%2 ? runA : runB);
    sprite(rows, 80, GROUND - 14*PX - st.y, PX);
    // HUD
    text(`SCORE ${String(st.score).padStart(5,"0")}`, Wd-20, 30, 12, ink, "right");
    text(`COINS ${st.coinN}`, 20, 30, 12, ink);
    if(!st.started) text("PRESS SPACE OR TAP TO START", Wd/2, 110, 12, ink, "center");
    if(st.over){ text("GAME OVER", Wd/2, 100, 22, "#FF004D", "center"); text("Blockers happen. Press space to go again.", Wd/2, 132, 10, ink, "center"); }
    dashRAF = requestAnimationFrame(step);
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { dashRAF = requestAnimationFrame(step); });
}
// ---------- AI tips for roles without hand-written content ----------
let aiBusy = false;
async function fetchAI(list){
  if(!SAMPLE || aiBusy) return;
  const need = list.concat(bonuses()).filter(it => !contentFor(it) && AI[it.key]===undefined);
  if(!need.length) return;
  aiBusy = true;
  const brief = need.map(it => { const stretch = A.ratings[it.key]==="Met"; return `KEY: ${it.key}\nNAME: ${it.name} (${it.kind})\nRATING: ${A.ratings[it.key]}\nTARGET: ${(stretch && it.nextText.length ? it.nextText : it.now).join(" / ")}`; }).join("\n\n");
  try{
    const res = await SAMPLE.json(`You write development guidance for TPXimpact, a UK digital transformation consultancy working mostly with public-sector and purpose-led clients. The person is a ${short(A.level)} ${A.role} (${A.practice}). For each item below, write guidance to reach the TARGET. For items rated "Partially Met" the target is what's expected at their level; for items rated "Met" the target is the next level up, to move them to "Exceeding". Write:
- "examples": 2 concrete, realistic examples (each under 40 words, second person, present tense) of someone doing the TARGET on a real client engagement.
- "actions": 2 specific things to try in the next month (each under 25 words, starting with a verb).
- "resource": one real, well-known book, course, framework or certification with "title" and "by". Only suggest things you're confident exist.
Use British English. Return ONLY JSON: {"items":[{"key":"...","examples":[],"actions":[],"resource":{"title":"","by":""}}]}

${brief}`, {modelTier:"quick"});
    (res.items||[]).forEach(x => { if(x && x.key && Array.isArray(x.examples)) AI[x.key] = {examples:x.examples.slice(0,2), actions:(x.actions||[]).slice(0,2), resource:x.resource && x.resource.title ? x.resource : null}; });
  }catch(e){ console.warn("tips failed", e); }
  need.forEach(it => { if(AI[it.key]===undefined) AI[it.key] = null; });
  aiBusy = false;
  if(A) vGame(true);
}
async function connectSample(){
  try{ if(window.claude && window.claude.use){ SAMPLE = await window.claude.use("sample"); if(SAMPLE && A) vGame(true); } }catch(e){}
}

// Unlock audio on the first tap or key press (needed on Safari/iOS)
["pointerdown","keydown"].forEach(ev => window.addEventListener(ev, () => { try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }, {once:true}));

// ---------- Boot ----------
try{ A = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ A = null; }
if(A && findRole(A.role)) vGame(); else { A = null; vStart(); }
connectSample();
</script>
