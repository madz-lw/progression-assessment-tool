approaches for major projects and provide guidance on risk approaches\n\n\u2022 Devise new test techniques and provide recommendations", "Leader": "", "Driver": ""}, "Governance and assurance": {"desc": "", "Learner": "\u2022 Understand technical governance\n\n\u2022 Participate in the assurance of a service", "Contributor": "\u2022 Understand how governance works and what governance is required\n\n\u2022 Support others to understand technical governance\n\n\u2022 Take responsibility for the assurance of a service and know what risks need to be managed\"", "Skilled": "\u2022 Support and advise on the appropriate governance for services or sets of services\n\n\u2022 Assure services across sets of services\n\n\u2022 Use tools such as standards, guardrails and principles to effectively govern delivery", "Expert": "\u2022 Understand how technical governance works with wider governance (such as budget)\n\n\u2022 Define appropriate governance for technology departments and sets of services\n\n\u2022 Assure corporate services by understanding important risks and mitigating them through assurance mechanisms", "Leader": "", "Driver": ""}, "Information security": {"desc": "", "Learner": "\u2022 Discuss information security and the security controls that can be used to mitigate security threats within solutions and services", "Contributor": "\u2022 Demonstrate an understanding of information security and the types of security controls that can be used to mitigate security threats within solutions and services", "Skilled": "\u2022 Understand information security\n\n\u2022 Design solutions and services with security controls embedded, specifically engineered with mitigation of security threats as a core feature", "Expert": "\u2022 Demonstrate in-depth knowledge of information security\n\n\u2022 Design, quality review and quality assure solutions and services with security controls embedded, specifically engineered with mitigation of security threats as a core feature", "Leader": "", "Driver": ""}, "Infrastructure as Code (Cloud)": {"desc": "", "Learner": "\u2022 Understand the principles and benefits of Infrastructure as Code. \n\n\u2022 Use existing templates and scripts under guidance to provision and modify cloud resources.", "Contributor": "\u2022 Develop, maintain and troubleshoot Infrastructure as Code solutions using approved tools and standards. \n\n\u2022 Create reusable templates and modules that support repeatable and consistent deployment of cloud resources.", "Skilled": "\u2022 Design and implement scalable, reusable and secure Infrastructure as Code architectures.\n\n\u2022 Establish modular design patterns, testing approaches and deployment pipelines that support multiple teams and environments.\n\n\u2022 Embed reliability, observability and operational requirements into Infrastructure as Code solutions to improve service resilience and recovery.\n\n\u2022 Review and improve implementations to ensure consistency, maintainability and compliance with organisational standards.\n\n\u2022 Provide technical guidance and mentoring to engineers adopting Infrastructure as Code practices.", "Expert": "\u2022 Define the organisational strategy, standards and governance for Infrastructure as Code.\n\n\u2022 Drive adoption of platform engineering, automation, reliability engineering and policy-as-code practices across the organisation.\n\n\u2022 Establish reusable frameworks, quality controls and operating models that enable secure, compliant, observable and resilient cloud services at scale.\n\n\u2022 Influence technology direction and engineering standards to maximise automation, consistency, operational resilience and service reliability.\n\n\u2022 Ensure Infrastructure as Code capabilities support organisational objectives, risk management requirements and cloud transformation initiatives.", "Leader": "", "Driver": ""}, "Life cycle management": {"desc": "", "Learner": "\u2022 You show an awareness of the different phases of the digital service lifecycle (Discovery, Alpha, Beta, Live, Retirement). You support basic delivery activities within a given phase under direct guidance.", "Contributor": "\u2022 You understand the differing mindsets and objectives required for individual lifecycle phases. You assist the team in preparing for standard phase gates or service assessments.", "Skilled": "\u2022 You guide a product team successfully through a specific lifecycle transition (e.g., moving from Alpha to Beta). You ensure early consideration of operational support models and transition criteria.", "Expert": "\u2022 You lead and coach teams through a product's entire lifecycle from inception to Live optimisation and eventual decommissioning. You establish robust, sustainable support models and balance continuous improvement against technical debt.", "Leader": "\u2022 You define the lifecycle governance, standards, and phase-gate criteria across an entire programme or service area. You lead strategies for legacy remediation and complex system retirement across multiple product teams.", "Driver": "\u2022 You set the enterprise-wide lifecycle strategy for the organisation's entire digital estate. You ensure systemic balance between funding new innovations and safely decommissioning legacy infrastructure to minimise departmental technical debt."}, "Lifecycle perspective (delivery)": {"desc": "", "Learner": "\u2022 You have limited, if any, experience of delivering projects at one or more stages of the project lifecycle (design or software delivery lifecycle), such as a Discovery or Alpha.\n\n\u2022 You have a theoretical understanding of the end to end project / software delivery lifecycle.", "Contributor": "\u2022 You have some experience of delivering projects across the full end to end project lifecycle (design or software delivery lifecycle).\n\n\u2022 You understand and can articulate the purpose and value of each stage of the delivery lifecycle.\n\n\u2022 You understand and can articulate some of the dependencies /\u00a0challenges at different stages of the project / software delivery lifecycle\n\n\u2022 You understand how following best practice supports delivery of successful project outcomes and at a rudimentary level can articulate the business impact of the work for users and the organisation.", "Skilled": "\u2022 You have significant experience of delivering projects across all stages of the project lifecycle (design or software delivery lifecycle).\n\n\u2022 You have significant understanding and experience of managing dependencies + challenges between the various phases of the project / software delivery lifecycle.\n\n\u2022 You also have hands on experience of the product lifecycle from introduction, growth, maturity to decline.\n\n\u2022 You understand how best practice supports delivery of successful project outcomes, are able to support the creation of benefits realisation measures, and can draw on experience to articulate the business impact of the work for users and the organisation", "Expert": "\u2022 You have extensive experience managing products and services through various lifecycle stages and you're able to guide teams through different lifecycle stages and set standards for each phase.\n\n\u2022 You manage transitions effectively and ensure that the team is working towards the appropriate standards. You provide mentorship on lifecycle management to team members.\n\n\u2022 You ensure that lifecycle considerations are integrated into project planning and execution.", "Leader": "\u2022 You have extensive experience of delivering projects across all stages of the project lifecycle (design or software delivery lifecycle) across a range of project types, and you'll specialise in one of those.\n\n\u2022 You have a deep understanding of and can articulate with ease the purpose, value, dependencies and challenges of each stage of the delivery lifecycle.\n\n\u2022 You'll also have extensive hands on experience of the product lifecycle from introduction, growth, maturity to decline.", "Driver": ""}, "Lifecycle perspective (Tech)": {"desc": "", "Learner": "\u2022 Understand how the needs of the team and the product vary across the stages of the product life cycle", "Contributor": "\u2022 Recognise when to move from one stage of a product life cycle to another\n\n\u2022 Ensure the team is working towards the appropriate service standards for the relevant phase\n\n\u2022 Manage the delivery of products and services at different phases", "Skilled": "\u2022 Apply experience in multiple parts of the product life cycle\n\n\u2022 Recognise when it is right to move forward and when it is right to stop\n\n\u2022 Recognise the appropriate deliverables and the right people to meet them\n\n\u2022 Work with other Agile delivery operations throughout the product life cycle\n\n\u2022 Plan and engage with the appropriate stakeholders at a particular stage in the project", "Expert": "\u2022 Successfully lead teams through the full product life cycle\n\n\u2022 Identify which tools and techniques should be used at each stage\n\n\u2022 Develop sustainable support models\n\n\u2022 Identify and deal with potential risks across or between all stages of the product life cycle\n\n\u2022 Coach others\n\n\u2022 Contribute to the assessment of other teams, providing guidance and support as they move through stages of the product life cycle", "Leader": "", "Driver": ""}, "Maintaining delivery momentum": {"desc": "", "Learner": "\u2022 You're beginning to understand how to set the pace of work for a team.\n\n\u2022 You are experimenting with helping the team prioritise work.\n\n\u2022 You are also experimenting with managing client expectations but are mainly learning how to do so from your project lead.", "Contributor": "\u2022 You understand how to set the pace of work for a team and ensure the team is delivering regularly.\n\n\u2022 You help the team prioritise work based on their opinions and that of the client.\n\n\u2022 You engage with the client to ensure we are managing their expectations", "Skilled": "\u2022 You set pace of work for a team, ensure they're delivering reguarly and create an environment where the entire team is comfortable but motivated by the tempo of work.\n\n\u2022 You help the team prioritise work based on their opinions, that of the client, and the strategic goals of the project.\n\n\u2022 You manage the client to ensure their expectations are met and surpassed.", "Expert": "\u2022 You facilitate the delivery flow of a team, managing the pace and tempo.\n\n\u2022 You're able to actively address internal and external risks, issues, and dependencies, including where ownership exists outside the team.\n\n\u2022 You help the team prioritise what work needs to happen when and ensure we are meeting clients' expectations while ensuring the team is delivering regularly and create an environment where the team is comfortable but motivated by the tempo of work.\n\n\u2022 You manage and predict risks, issues, and dependencies, involving the wider team in the management of issues.", "Leader": "\u2022 You create high-functioning teams who work at pace, deliver regularly, and the team is comfortable but motivated by the tempo of work.\n\n\u2022 You manage and predict risks, issues, and dependencies, involving the wider team in the management of issues. You also predict what issues may emerge based on your experience.\n\n\u2022 You help the team prioritise work effectively based on their opinions, that of the client, and the strategic goals of the project while also balancing that with TPXimpact's priorities for the work.\n\n\u2022 You proactively manage the client to ensure their expectations are met and surpassed.", "Driver": "\u2022 You create high-functioning teams who work at pace, deliver regularly, and the team is comfortable but motivated by the tempo of work. You manage and predict risks, issues, and dependencies, involving the wider team in the management of issues. You also predict what issues may emerge based on your experience. You help the team prioritise work effectively based on their opinions, that of the client, and the strategic goals of the project while also balancing that with TPXimpact's priorities for the work. You proactively manage the client to ensure their expectations are met and surpassed.\n\n\u2022 Not only do you work with project teams, you also work to create and maintain momentum throughout the delivery practice and TPXimpact as a business. This includes supporting team members to prioritise personal development and team initiatives alongside project work."}, "Making a process work": {"desc": "", "Learner": "\u2022 You understand the principles behind what \"good' business processes look like.\n\n\u2022 You have limited experience in running workshops to understand current business processes and articulating improvements.\n\n\u2022 You have limited experience of re-designing, testing, evaluating and implementing new business processes within organisations.", "Contributor": "\u2022 You understand the principles behind what \"good' business processes look like and can articulate the impact of inefficiency from a financial and productivity perspective.\n\n\u2022 You have some experience in running workshops both remotely and in-person to understand current business processes, highlighting areas for change and articulating improvements.\n\n\u2022 You have some experience of re-designing, testing, evaluating and\u00a0 implementing simple or stand alone business processes.", "Skilled": "\u2022 You fundamentally understand the principles behind what \"good' business processes look like and can articulate the impact of inefficiency from a financial and productivity perspective.\n\n\u2022 You're comfortable working across multiple business processes spanning different teams and are usually able to understand where there are overlaps, dependencies and conflicts across those processes.\n\n\u2022 You have significant experience in running workshops both remotely and in-person.\n\n\u2022 You have significant experience of re-designing, testing, evaluating and implementing complex, isolated business processes as well as business processes that span multiple teams, departments and divisions.", "Expert": "\u2022 You are an expert in identifying and challenging complex organisational processes, and able to coach teams through new process implementations. You inspect and adapt organisational processes to reduce complexity.\n\n\u2022 You're able to run large or complex workshops to understand current business processes and articulate improvements. You implement new business processes within organisations and measure their effectiveness.", "Leader": "\u2022 You deeply understand the principles behind what \"good' business processes look like and can articulate the impact of inefficiency from a strategic, financial, user interaction, and productivity perspective.\n\n\u2022 You have extensive experience in running workshops both remotely and in-person.\n\n\u2022 Mapping, redesigning, testing and evaluating business processes is second nature and you're seen as the 'go-to' person for support by both your peers and clients.", "Driver": ""}, "Metadata management": {"desc": "", "Learner": "", "Contributor": "\u2022 Work with metadata repositories to complete complex tasks such as data and systems integration impact analysis\n\n\u2022 Maintain a repository to ensure information remains accurate and up to date", "Skilled": "\u2022 Design an appropriate metadata repository and present changes to existing metadata repositories\n\n\u2022 Understand a range of tools for storing and working with metadata\n\n\u2022 Provide oversight and advice to more inexperienced members of the team", "Expert": "\u2022 Understand how metadata repositories can support different areas of the business\n\n\u2022 Promote and communicate the value of metadata repositories\n\n\u2022 Set up robust governance processes to keep repositories up to date", "Leader": "", "Driver": ""}, "Modern standards approach": {"desc": "", "Learner": "\u2022 Understand the importance of adopting a modern standards approach", "Contributor": "\u2022 Explain the most important principles of a modern standards approach and how they apply to the work you are undertaking\n\n\u2022 Apply these principles under guidance", "Skilled": "\u2022 Competently apply a modern standards approach and guide others to do so", "Expert": "\u2022 Demonstrate a strong understanding of the most appropriate modern standards and practices, and how they are applied\n\n\u2022 Coach and guide others in these standards", "Leader": "", "Driver": ""}, "Non-functional testing": {"desc": "", "Learner": "\u2022 Show an awareness of non-functional testing techniques\n\n\u2022 Execute non-functional test scenarios and identify defects\n\n\u2022 Run non-functional tests others have written and know the processes to do so\n\n\u2022 Understand a range of standard non-functional testing techniques", "Contributor": "\u2022 Design and execute non-functional test cases using standard testing techniques, in instructed environments\n\n\u2022 Come up with different business scenarios for a feature, working with others in the team", "Skilled": "\u2022 Design and execute a wide range of non-functional testing techniques\n\n\u2022 Communicate non-functional test results to both technical and non-technical stakeholders\n\n\u2022 Make decisions on running types of non-functional testing\n\n\u2022 Coach and mentor others\n\n\u2022 Assess and peer-review the work of others\n\n\u2022 Identify defects, alert the business to them, and help to prioritise them based on defect severity", "Expert": "\u2022 Advise on up-to-date non-functional testing techniques\n\n\u2022 Assess and peer-review the work of others\n\n\u2022 Coach and mentor others\n\n\u2022 Write non-functional test approaches for major projects and provide guidance on risk approaches\n\n\u2022 Devise new non-functional test techniques and provide recommendations", "Leader": "", "Driver": ""}, "Outcomes and benefits realisation": {"desc": "", "Learner": "\u2022 You show an awareness of the fundamental difference between outputs (features), outcomes, and benefits. You support the team in capturing simple user needs under supervision.", "Contributor": "\u2022 You can articulate the difference between outputs, real-world outcomes, and measurable benefits. You assist the team in tracking basic performance metrics and mapping features to near-term benefits.", "Skilled": "\u2022 You independently align product features with intended user outcomes and measurable business value. You work directly with data and user feedback to validate that the delivered backlog items are achieving their short-term goals.", "Expert": "\u2022 You define and quantify measurable outcomes and benefits for a product, creating a clear benefits realisation plan across its lifecycle. You gather and analyse complex performance data to track progress against KPIs and inform the backlog.", "Leader": "\u2022 You are accountable for the full lifecycle of benefits realisation for a large-scale or complex service. You develop sophisticated benefits maps and financial models to track cashable and non-cashable efficiencies, defending trade-offs to senior leaders.", "Driver": "\u2022 You set the benefits realisation strategy across a complex departmental portfolio, ensuring alignment with overarching strategic objectives. You lead the economic and strategic cases for major business cases, directly shaping investment decisions."}, "Planning and strategy (Content Design)": {"desc": "The ability to plan and set up content design work for success, using content design principles, and planning strategic content approaches. This includes setting client expectations, preparing work for success, onboarding successfully into a project, or clarifying work with clients", "Learner": "\u2022 Understand and can support how content design principles are applied by teams\n\n\u2022 Have some awareness of what content strategy and governance is and when there's a need to apply it", "Contributor": "\u2022 Understand and can apply content design principles\n\n\u2022 Understand what content strategy and governance is and when there's a need to apply it\n\n\u2022 Follow content strategy or governance processes set by others", "Skilled": "\u2022 Identify content opportunities to best achieve client outcomes and goals\n\n\u2022 Create, apply and manage content strategy or governance processes \n\n\u2022 Direct and help others to follow and implement elements of content strategy or governance processes", "Expert": "\u2022 Support stakeholders prepare for a large programme of content work\n\n\u2022 Create, apply and manage content strategy or governance processes in more complex envirornments\n\n\u2022 Identify where new content strategy or governance processes may be needed, advocating succesfully with clients and stakeholders, as owning implementation\n\n\u2022 Develop onboarding materials for other content designers\n\n\u2022 Maintain and keep a design decision log up to date", "Leader": "", "Driver": ""}, "Planning and strategy (Design Research)": {"desc": "The ability to plan and use research and analysis effectively, onboarding successfully into a project, and clarifying work with project leadership or clients. This includes elements of setting client and team expectations, designing research appropriately, and preparing work for success.", "Learner": "\u2022 Understand the context, challenges, aims and objectives of work\n\n\u2022 Consolidate and review known evidence, assumptions, hypotheses to support problem framing\n\n\u2022 Define knowledge gaps by collating team and stakeholder questions\n\n\u2022 Awareness of a range of methods across exploratory generative evaluative research methodologies\n\n\u2022 Awareness of participant recruitment and management, incentives process, informed consent and data storage on projects in compliant with GDPR", "Contributor": "\u2022 Understand how your work contributes to the long-term client goals and vision to ensure alignment\n\n\u2022 Consolidate and review known evidence, assumptions, hypotheses to support problem framing\n\n\u2022 Define research scope and objectives based on the problem a team is trying to solve and budget/timeline. Using a range of techniques (work done to date, desk research, facilitation, stakeholder interviews)\n\n\u2022 Create and maintain research plans for contextual and usability testing studies with minimal supervision, aligned with interdependent milestones and sector-specific calendars e.g. the school year or agricultural calendar\n\n\u2022 Setup and manage participant recruitment, incentives process, informed consent and data storage on projects in compliant with GDPR\n\n\u2022 Manage research sessions scheduling for particpants and team members", "Skilled": "\u2022 Continuously seek to understand client outcomes, aims, constraints and design maturity to select research approaches and develop plans\n\n\u2022 Draw from a variety of data sources (literature reviews, previous research findings reports, statistical data, analytics, social listening, heuristic evaluation, competitor analysis) to better inform problem framing\n\n\u2022 Identify key considerations and research objectives necessary to ensure a project team can make evidence-based decisions to achieve client outcomes\n\n\u2022 Select appropriate methods and participant samples, highlighting and mitigating risks and limitations.\n\n\u2022 Effectively create and adapt research and analysis plans that consider and align with interdependent milestones and sector-specific calendars (e.g. the school year or agricultural calendar). Including giving direction and feedback to others as required", "Expert": "\u2022 Identify new research and impact opportunities on projects\n\n\u2022 Help a client design and cost programmes of work\n\n\u2022 Help stakeholders prepare and coordinate large programmes of research and analysis work\n\n\u2022 Help develop onboarding materials for other researchers and analysts on a project\n\n\u2022 Lead and coach internal and client teams in consolidating and reviewing internal and sector knowledge and gaps to inform problem framing\n\n\u2022 Lead and coach internal and client teams to plan research and analysis activities according to project aims and constraints\n\n\u2022 Work within a multidisciplinary team or embedded in a client team and use evidence-based problem framing to achieve shared understanding and resolve project ambiguity\n\n\u2022 Develop onboarding materials for other researchers and analysts\n\n\u2022 Maintain and keep decision logs up to date", "Leader": "", "Driver": ""}, "Planning and strategy (Design Strategy)": {"desc": "Helping clients make strategic decisions based on user centred design and service principles, and growing our work for greater impact with clients.", "Learner": "n/a", "Contributor": "n/a", "Skilled": "n/a", "Expert": "n/a", "Leader": "\u2022 Own project direction, managing ambiguity and leading strategic design approaches to vision setting, problem framing, planning work and delivering outcomes that put users at the heart of critical transformation and improvement efforts in client organisations\n\n\u2022 Provide creative and technical leadership, ensuring work is bold and ambitious, while knowing when to seek support or inspiration from others\n\n\u2022 Develop client relationships - challenging and coaching senior clients in ways that enables progress within change and transformation programmes.\n\n\u2022 Support growth, developing trusted relationships with our clients, proactively looking for and shaping the next opportunity to win work and add value, and demonstrably sharing work with wider audiences to showcase our skills and impact.", "Driver": ""}, "Planning and Strategy (Impact Analysis)": {"desc": "The ability to plan and use research and analysis effectively, onboarding successfully into a project, and clarifying work with project leadership or clients. This includes elements of setting client and team expectations, supporting teams and senior stakeholders to articulate their purpose, and interrogating how they can achieve desired outcomes", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Continuously seek to understand client and policy intent and outcomes, aims, constraints and data maturity to select appropriate and achievable plans for impact modelling, MandE and performance analysis approaches\n\n\u2022 Draw from a variety of data sources (literature reviews, previous research findings reports, statistical data, analytics, social listening, heuristic evaluation, competitor analysis) to better inform problem framing\n\n\u2022 Identify key considerations for modelling, evaluation and/or case for change necessary to ensure a project team can make evidence-based decisions to achieve client outcomes\n\n\u2022 Understand the consequences of not having an appropriate sample and the impact on the interpretation of data to select appropriate methods and data samples, highlighting and mitigating risks and limitations\n\n\u2022 Effectively create and adapt stakeholder engagement and data collection plans that consider and align with interdependent milestones and sector-specific calendars (e.g. the school year or agricultural calendar). Including giving direction and feedback to others as required", "Expert": "\u2022 Identify new research and impact opportunities on projects\n\n\u2022 Help stakeholders prepare and coordinate large programmes of impact modelling, case of change or evaluation work\n\n\u2022 Undertake option appraisals and cost benefit analysis to inform design and investment decisions\n\n\u2022 Develop onboarding materials for other researchers and analysts on a project\n\n\u2022 Lead and coach internal and client teams in consolidating and reviewing internal and sector knowledge and gaps to inform problem framing\n\n\u2022 Lead and coach internal and client teams to plan impact development research and analysis activities according to project aims and constraints\n\n\u2022 Work within a multidisciplinary team or embedded in a client team and use evidence-based problem framing to achieve shared understanding and resolve project ambiguity\n\n\u2022 Develop onboarding materials for other researchers and analysts\n\n\u2022 Maintain and keep decision logs up to date", "Leader": "", "Driver": ""}, "Planning and strategy (Interaction Design)": {"desc": "Setting up work for success as an interaction designer. This includes setting client expectations, preparing work for success, onboarding successfully into a project, or clarifying work with clients", "Learner": "\u2022 Have awareness of long-term goals, vision and product strategy when part of work", "Contributor": "\u2022 Understand how your work contributes to long-term goals, vision and product strategy, ensuring design decisions are in line with them \n\n\u2022 Support the strategic direction of services by shaping problem framing and product propositions", "Skilled": "\u2022 Identify interaction design opportunities to best achieve client outcomes and goals\n\n\u2022 Contribute and improve the long-term goals and vision of product strategy through your work\n\n\u2022 Frame product strategy in ways others can understand, including how we'll achieve it to guide teams\n\n\u2022 Use problem framing and product propositions to support the strategic direction of work", "Expert": "\u2022 Define, implement and influence the long-term goals and vision of product strategy\n\n\u2022 Work with clients to design and cost programmes of work \n\n\u2022 Work with stakeholders to prepare for a large programme of interaction design work\n\n\u2022 Develop onboarding materials for other interaction designers\n\n\u2022 Maintain and keep a design decision log up to date \n\n\u2022 Build and develop successful high-functioning product-focused teams where appropriate", "Leader": "", "Driver": ""}, "Planning and strategy (Org Design)": {"desc": "Setting up work for success as an organisation designer. This includes setting client expectations, developing service propositions, auditing and understanding the organisation and system landscape, onboarding into a project, and/or clarifying work with clients and stakeholders.", "Learner": "n/a", "Contributor": "n/a", "Skilled": "\u2022 Support teams and senior stakeholders to articulate vision, mission, strategy, priorities and a plan to deliver strategic ambitions\n\n\u2022 Support the design and costing of programmes of work\n\n\u2022 Lead work to identify strengths, gaps, challenges, barriers, and opportunity areas for an organisation or within a system, fostering a culture of continuous improvement and innovation\n\n\u2022 Create and develop our service propositions, assessing their impact and value through user feedback and performance metrics\n\n\u2022 Carry out audits to assess organisation performance and how it meets user and business needs", "Expert": "\u2022 Identify opportunities on projects, informing how user, organisation and community needs are being understood and met\n\n\u2022 Shape future programmes of work, making sure that our design, change, impact and/or research work is well planned and well-executed\n\n\u2022 Collaborate with stakeholders to prepare for large and/or complex programmes of transformation work\n\n\u2022 Understand and support designers/researchers/technologists/analysts across multiple projects and disciplines\n\n\u2022 Develop onboarding materials for other designers\n\n\u2022 Maintain and keep a design decision log up to date \n\n\u2022 Build and develop successful high-functioning service-focused teams where appropriate", "Leader": "", "Driver": ""}, "Planning and strategy (Service Design)": {"desc": "Setting up work for success as an service designer. This includes setting client expectations, developing service propositions, auditing and understanding the service and system landscape, onboarding into a project, and/or clarifying work with clients and stakeholders.", "Learner": "\u2022 Understand how to identify the users of a service, and support others with planning and strategic service design activites", "Contributor": "\u2022 Identify the users who need to use a service using a wide variety of methods and stakeholder engagement.\n\n\u2022 Capture, map, and communicate a service taxonomy (system, whole service, service, sub-service, service components) along with the related stakeholders\n\n\u2022 Identify service dependancies and map related stakeholders", "Skilled": "\u2022 Support teams and senior stakeholders to articulate vision, mission, strategy, priorities and a plan to deliver strategic ambitions\n\n\u2022 Support the design and costing of programmes of work\n\n\u2022 Lead work to identify, define, and shape the strategic design, development, and iteration of services, fostering a culture of continuous improvement and innovation\n\n\u2022 Create and develop our service propositions, assessing their impact and value through user feedback and performance metrics.\n\n\u2022 Carry out audits to assess service performance and how it meets user and business needs", "Expert": "\u2022 Identify opportunities on projects, informing how user, organisation and community needs are being understood and met\n\n\u2022 Shape future programmes of work, making sure that our design, change, impact and/or research work is well planned and well-executed\n\n\u2022 Collaborate with stakeholders to prepare for large and/or complex programmes of transformation work\n\n\u2022 Understand and support designers/researchers/technologists/analysts across multiple projects and disciplines\n\n\u2022 Develop onboarding materials for other designers\n\n\u2022 Maintain and keep a design decision log up to date \n\n\u2022 Build and develop successful high-functioning service-focused teams where appropriate", "Leader": "", "Driver": ""}, "Problem management (Delivery)": {"desc": "", "Learner": "\u2022 Investigate problems in project systems and project processes, with an understanding of the level of a problem (for example, strategic, tactical or operational)\n\n\u2022 Contribute to the implementation of remedies and preventative measures within a project.", "Contributor": "\u2022 Investigate problems in project systems and project processes, with an understanding of the level of a problem (for example, strategic, tactical or operational)\n\n\u2022 Contribute to the implementation of remedies and preventative measures within a project.", "Skilled": "\u2022 Initiate and monitor actions taken in past projects to resolve common client problems\n\n\u2022 Effectively consult specialists where required.\n\n\u2022 Determine preventative measures for smooth delivery of projects.", "Expert": "\u2022 You're able tp ensure that the right actions are taken to investigate, resolve, and anticipate delivery problems.\n\n\u2022 You co-ordinate the team to investigate problems, implement solutions, and take preventive measures to improve project delivery. You effectively consult specialists where required.\n\n\u2022 You determine preventative measures for smooth delivery of projects by initiating and monitoring actions taken in past projects to resolve common client problems.", "Leader": "\u2022 Ensure that the right actions are taken to investigate, resolve and anticipate delivery problems.\n\n\u2022 Co-ordinate the team to investigate problems, implement solutions and take preventive measure to improve project delivery.", "Driver": "\u2022 You are often brought in to address problems within teams that cannot be managed by the team themselves.\n\n\u2022 You are also drawn in to manage acute issues with clients on projects and programmes where one or several delivery staff are working."}, "Problem management (Tech)": {"desc": "", "Learner": "\u2022 Investigate problems in systems, processes and services, with an understanding of the level of a problem (for example, strategic, tactical or operational)\n\n\u2022 Contribute to the implementation of remedies and preventative measures", "Contributor": "\u2022 Initiate and monitor actions to investigate patterns and trends to resolve problems\n\n\u2022 Effectively consult specialists where required\n\n\u2022 Determine the appropriate remedy and assist with its implementation\n\n\u2022 Determine preventative measures", "Skilled": "\u2022 Ensure that the right actions are taken to investigate, resolve and anticipate problems\n\n\u2022 Co-ordinate the team to investigate problems, implement solutions and take preventive measures", "Expert": "\u2022 Anticipate problems and defend against them at the right time\n\n\u2022 Understand how the problem fits into the larger picture\n\n\u2022 Articulate the problem and help others to do so\n\n\u2022 Build problem-solving capabilities in others", "Leader": "", "Driver": ""}, "Product ownership": {"desc": "", "Learner": "\u2022 You support the development of simple user stories or small features under direct supervision. You are learning how to articulate basic product decisions and understand the team's immediate goals.", "Contributor": "\u2022 You take responsibility for defining and delivering individual user stories or minor features. You ensure they meet user needs and acceptance criteria, collaborating directly with the immediate delivery team.", "Skilled": "\u2022 You own and ruthlessly prioritise a product backlog to deliver the most value. You are the primary point of contact for the team, confidently balancing user needs, policy intent, and technical feasibility, and making daily tactical decisions.", "Expert": "\u2022 You are accountable for an entire product or service lifecycle. You own the product strategy, roadmap, and benefits case, while managing complex stakeholder maps and negotiating with SROs and commercial teams.", "Leader": "\u2022 You own a whole service area or overarching mission. You set the high-level \"North Star\" and strategic roadmap that multiple product managers align to, establishing the governance and guardrails that empower your teams.", "Driver": "\u2022 You are the ultimate point of accountability for the collective success and public value of the department's digital service portfolio. You define organisational standards, build profession capability, and advise senior clients on funding and governance models."}, "Programming and build (data engineering)": {"desc": "", "Learner": "\u2022 Show an awareness of standards and processes for the the design, code, test, correct and document simple programs", "Contributor": "\u2022 Design, code, test, correct and document simple programs or scripts under the direction of others", "Skilled": "\u2022 Use agreed standards and tools to design, code, test, correct and document moderate-to-- - complex programs and scripts from agreed specifications and subsequent iterations\n\n\u2022 Collaborate with others to review specifications where appropriate", "Expert": "\u2022 Set local or team-based standards for programming tools and techniques and can select appropriate development methods\n\n\u2022 Advise on the application of standards and methods and ensure compliance\n\n\u2022 Take technical responsibility for all stages and iterations in a software development project, providing method-specific technical advice and guidance to project stakeholders", "Leader": "", "Driver": ""}, "Programming and build (software engineering)": {"desc": "", "Learner": "\u2022 Spend a substantial portion of time shadowing others\n\n\u2022 Work with other developers to write code and tests\n\n\u2022 Build your knowledge\n\n\u2022 Follow a test-driven approach\n\n\u2022 Write code that is automatically tested\n\n\u2022 Primarily using one programming language or framework, but aware of others", "Contributor": "\u2022 Develop skills while working under supervision to deliver stories in a multidisciplinary team\n\n\u2022 Understand and be proficient in different types of testing\n\n\u2022 Be aware of but not responsible for security\n\n\u2022 Be aware of but not responsible for IAC\n\n\u2022 Be aware of but not responsible for testing\n\n\u2022 Coach and mentor more junior colleagues\n\n\u2022 Able to use multiple programming languages and frameworks to a sufficient level, might specialise in one", "Skilled": "\u2022 Plan and lead development on sets of related stories\n\n\u2022 Have an understanding of the whole system and take responsibility for teaching this to others\n\n\u2022 Work with other disciplines to understand what needs to be built\n\n\u2022 Coach and mentor more junior colleagues\n\n\u2022 Operate the production services you build\n\n\u2022 Find ways to improve system robustness, resilience and stability\n\n\u2022 Deliver code via full automation including CI pipelines and IAC\n\n\u2022 Testing is at the heart of what you deliver \n\n\u2022 Able to pick up new programming languages easily, tech agnostic engineering skills", "Expert": "\u2022 Guide the ways in which the team works\n\n\u2022 Be proficient in a wide range of technical systems\n\n\u2022 Be involved in identifying appropriate technology and approaches, deciding when software should be written\n\n\u2022 Contribute to the developer community\n\n\u2022 Provide technical leadership, coaching and mentoring your team\n\n\u2022 Promote knowledge sharing and adoption of good practice\n\n\u2022 Ensure best practise is upheld, including IAC, testing, delivery pipelines\n\n\u2022 Able to move between programming languages and have a clear unsterstanding of why one might be better for a given job", "Leader": "", "Driver": ""}, "Prototyping": {"desc": "", "Learner": "\u2022 Explain what prototyping is, and why and when to use it\n\n\u2022 Understand how to work in an open and collaborative environment (by pair working, for example)", "Contributor": "\u2022 Understand when to use a specific prototyping technique or method\n\n\u2022 Show the value of prototyping to your team", "Skilled": "\u2022 Approach prototyping as a team activity, actively soliciting prototypes and testing with others\n\n\u2022 Establish design patterns and iterate them\n\n\u2022 Use a variety of prototyping methods and choose the most appropriate", "Expert": "\u2022 Use a variety of prototyping methods\n\n\u2022 Share best practice and coach others\n\n\u2022 Look at strategic service design end to end", "Leader": "", "Driver": ""}, "Requirements definition and management": {"desc": "", "Learner": "\u2022 Support identifying, analysing, capturing and validating business and user requirements\n\n\u2022 Work under supervision to manage requirements and support their prioritisation, within a defined scope\n\n\u2022 Provide distinct task-based outputs for parts of the project as directed, using a predetermined requirements management life cycle", "Contributor": "\u2022 Identify, analyse, challenge and validate business and user requirements\n\n\u2022 Work under limited supervision to co-ordinate and review the prioritisation of requirements\n\n\u2022 Use appropriate requirements management life cycle methods to complete tasks and outputs related to the project", "Skilled": "\u2022 Advise on the approach to requirements management within a project or programme\n\n\u2022 Define the most appropriate requirements management life cycle methods and ensure the requirement can be traced in the design, build, test, tender and evaluation phases\n\n\u2022 Co-ordinate and review the prioritisation of requirements and engage in the negotiation of solutions to help meet programme objectives", "Expert": "\u2022 Direct the approach to requirements management\n\n\u2022 Enable others to select and apply appropriate life cycle methods\n\n\u2022 Influence the prioritisation of complex requirement sets, enabling long-term strategic decision making and short-term tactical fixes\n\n\u2022 Ensure the proposed solutions align with the organisational strategy and vision", "Leader": "", "Driver": ""}, "Service focus": {"desc": "", "Learner": "\u2022 Show an awareness of different products and services", "Contributor": "\u2022 Take inputs and establish coherent frameworks that work", "Skilled": "\u2022 See the bigger picture by taking groups of services and investigating how to get the best of underlying services", "Expert": "\u2022 Maintain focus on the entire life cycle of the service and ensure it\u2019s at the forefront of readiness activities\n\n\u2022 Understand and communicate service benefits to end users\n\n\u2022 Ensure that service focus is championed within your team and actively recommend its adoption", "Leader": "", "Driver": ""}, "Service management framework knowledge": {"desc": "", "Learner": "\u2022 Have a Level 3 service management framework qualification", "Contributor": "\u2022 Have a Level 3 service management framework qualification\n\n\u2022 Demonstrate knowledge of the life cycle or capability elements of ITIL (Information Technology Infrastructure Library)", "Skilled": "\u2022 Have an expert certificate in the service management framework qualification", "Expert": "\u2022 Have an expert certificate in the service management framework qualification\n\n\u2022 Demonstrate an industry understanding of how to implement the framework into numerous environments", "Leader": "", "Driver": ""}, "Service reporting": {"desc": "", "Learner": "\u2022 Collate data from depositories and provide basic reporting", "Contributor": "\u2022 Produce relevant reports in a standard format and agreed timeframe\n\n\u2022 Work with important stakeholders to discuss any changes in the reporting processes\n\n\u2022 Add a commentary that provides an interpretation of the data set", "Skilled": "\u2022 Use your data analytics skills to enhance business performance", "Expert": "\u2022 Use prediction methodologies to derive and maintain a holistic view of important trends across multiple processes", "Leader": "", "Driver": ""}, "Solution architecture": {"desc": "", "Learner": "\u2022 Assist as part of a team in the design of components of larger systems\n\n\u2022 Contribute to the development of solution architectures in specific business, infrastructure or functional areas", "Contributor": "\u2022 Identify and evaluate alternative architectures and the trade-offs in cost, performance and scalability\n\n\u2022 Determine and document architecturally significant decisions\n\n-produce specifications of cloud-based or on-premises components, tiers and interfaces, for translation into detailed designs using selected services and products\n\n\u2022 Support projects or change initiatives through the preparation of technical plans and application of design principles\n\n\u2022 Align solutions with enterprise and solution architecture standards (including security)", "Skilled": "\u2022 Lead the development of solution architectures in specific business, infrastructure or functional areas\n\n\u2022 Lead the preparation of technical plans and ensure that appropriate technical resources are made available\n\n\u2022 Ensure that appropriate tools and methods are available, understood and employed in architecture development\n\n\u2022 Provide technical guidance and governance on solution development and integration. \n\n\u2022 Evaluate requests for changes and deviations from specifications and recommend actions\n\n\u2022 Ensure that relevant technical strategies, policies, standards and practices (including security) are applied correctly", "Expert": "\u2022 Lead the development of architectures for complex solutions ensuring consistency with agreed requirements\n\n\u2022 Establish policies, principles and practices for the selection of solution architecture component\n\n\u2022 Manage trade-offs and balances functional, service quality and systems management requirements within a significant area of the organisation\n\n\u2022 Communicate proposed decisions to stakeholders\n\n\u2022 Coordinate and manage the target architecture across multiple projects or initiatives. \n\n\u2022 Maintain a stable, viable architecture and ensure consistency of design and adherence to appropriate standards across multiple projects or initiatives", "Leader": "", "Driver": ""}, "Strategic ownership": {"desc": "", "Learner": "\u2022 You understand the purpose of a product vision and roadmap. You support the product team by gathering information, user data, and policy background to contribute to alignment tasks.", "Contributor": "\u2022 You communicate the immediate product goals clearly to your delivery team. You assist in updating roadmaps and aligning near-term features with defined team objectives under guidance.", "Skilled": "\u2022 You engage directly with users and immediate stakeholders to help define a clear product vision. You build, maintain, and iterate a short-to-medium term roadmap based on user insights and strategic value.", "Expert": "\u2022 You own and drive the long-term strategy and roadmap for a complex product or suite of features. You align diverse, competing stakeholder groups around the vision and successfully defend the product's direction to secure investment.", "Leader": "\u2022 You establish the overarching \"North Star\" and strategic direction for a major service area or mission. You coordinate multiple distinct product strategies to ensure collective alignment with wider client priorities and policy.", "Driver": "\u2022 You shape national digital strategies and cross-government product direction. You hold ultimate accountability for the strategic coherence of the entire department's portfolio, guiding long-term public sector investment decisions."}, "Strategic thinking": {"desc": "", "Learner": "\u2022 Explain the strategic context of your work and why it is important\n\n\u2022 Support strategic planning in an administrative capacity", "Contributor": "\u2022 Work within a strategic context and communicate how activities meet strategic goals\n\n\u2022 Contribute to the development of strategy and policies", "Skilled": "\u2022 Define strategies and policies, providing guidance to others on working in the strategic context\n\n\u2022 Evaluate current strategies to ensure business requirements are being met and exceeded where possible", "Expert": "\u2022 Lead the design and implementation of strategy, directing the evaluation of strategies and policies to ensure business requirements are being met", "Leader": "", "Driver": ""}, "Strategic thinking and planning": {"desc": "", "Learner": "\u2022 Show an awareness of the strategic context of a project and understand why it is important.\n\n\u2022 Support strategic planning in an administrative capacity.", "Contributor": "\u2022 Show an awareness of the strategic context of a project and understand why it is important.\n\n\u2022 Support strategic planning in an administrative capacity.", "Skilled": "\u2022 Support the creation and development of delivery strategies and policies.\n\n\u2022 Contribute to iterating and improving processes and guidelines.\n\n\u2022 Understand how delivery activities meet strategic / business wide goals.", "Expert": "\u2022 You understand the environment and can prioritise the most important or highest value tasks\n\n\u2022 You use data to inform planning and manage complex internal and external dependencies\n\n\u2022 You provide delivery confidence and remove blockers or impediments that affect plans\n\n\u2022 You develop a plan for difficult situations and ensure that teams plan appropriately for their own capacity\n\n\u2022 You contribute to delivery strategies and policies, create delivery standards, and provide support for delivery improvement projects", "Leader": "\u2022 Contribute to delivery strategies and policies.\n\n\u2022 Create delivery standards.\n\n\u2022 Provide support for delivery improvement projects.\n\n\u2022 Effectively focus on outcomes rather than solutions and activities.", "Driver": "\u2022 Craft delivery strategies and policies that can be used as templates and direction for the wider delivery team.\n\n\u2022 Create delivery standards and craft new standards as the practice requires them.\n\n\u2022 Provide support for delivery improvement projects.\n\n\u2022 Effectively focus on outcomes rather than solutions and activities."}, "Systems analysis": {"desc": "", "Learner": "\u2022 Support the analysis of IT system capabilities and work under supervision to identify and specify system requirements\n\n\u2022 Support the development of specifications and models for bespoke IT systems or software packages", "Contributor": "\u2022 Identify and analyse IT system capabilities\n\n\u2022 Develop models and system requirements for bespoke IT systems or software packages, with minimal supervision", "Skilled": "\u2022 Lead the identification and analysis of IT system capabilities, developing models and system requirements\n\n\u2022 Use systems analysis to support a deeper understanding of how processes and systems work, and to identify gaps\n\n\u2022 Work with other digital professionals to design and develop system and user interfaces, identify gaps in functionality and assess the effect of proposed software changes on users or the organisation", "Expert": "\u2022 Set the direction for the identification and analysis of IT system capabilities\n\n\u2022 Identify gaps in functionality and enable others to explore and assess the effect of software changes\n\n\u2022 Demonstrate a strong understanding of business perspectives and technical concepts, and can bring them together to form recommendations and a common understanding\n\n\u2022 Communicate this effectively between users, development teams and external suppliers", "Leader": "", "Driver": ""}, "Systems design": {"desc": "", "Learner": "\u2022 Assist as part of a team in the design of components of larger systems", "Contributor": "\u2022 Translate logical designs into physical designs\n\n\u2022 Produce detailed designs\n\n\u2022 Effectively document all work using required standards, methods and tools, including prototyping tools where appropriate\n\n\u2022 Design systems characterised by managed levels of risk, manageable business and technical complexity, and meaningful impact\n\n\u2022 Work with well understood technology and identify appropriate patterns", "Skilled": "\u2022 Design systems characterised by medium levels of impact, and business or technical complexity\n\n\u2022 Select appropriate design standards, methods and tools, and ensure they are applied effectively\n\n\u2022 Review the systems designs of others to ensure the selection of appropriate technology, efficient use of resources and integration of multiple systems and technology", "Expert": "\u2022 Design systems characterised by high levels of impact, and business or technical complexity\n\n\u2022 Control system design practice within an enterprise or industry architecture\n\n\u2022 Influence industry-based models for the development of new technology applications\n\n\u2022 Develop effective implementation and procurement strategies, consistent with business needs\n\n\u2022 Ensure adherence to relevant technical strategies, policies, standards and practices", "Leader": "", "Driver": ""}, "Systems design (Cloud)": {"desc": "", "Learner": "\u2022 Assist as part of a team in the design of components of larger systems.\n\n\u2022 Understand cloud-based architecture principles and the importance of modern engineering standards.\n\n\u2022 Recognise how system design decisions affect service outcomes and user experience.", "Contributor": "\u2022 Translate logical designs into physical designs.\n\n\u2022 Produce detailed designs and effectively document work using required standards, methods and tools.\n\n\u2022 Design systems characterised by managed levels of risk and complexity.\n\n\u2022 Apply modern cloud and engineering principles under guidance.\n\n\u2022 Consider operational support, maintainability and service requirements during design activities.", "Skilled": "\u2022 Design systems characterised by medium levels of impact and business or technical complexity.\n\n\u2022 Select and apply appropriate design standards, methods, tools and cloud patterns.\n\n\u2022 Review the designs of others to ensure effective use of technology, resources and integration approaches.\n\n\u2022 Promote modern standards, cloud-native practices and service-centric design principles.\n\n\u2022 Design services holistically, considering dependencies across multiple products, platforms and supporting services.\n\n\u2022 Design systems that meet availability, reliability, scalability, observability and supportability requirements.\n\n\u2022 Balance user needs, operational requirements, financial considerations and technical constraints when making design decisions", "Expert": "\u2022 Design systems characterised by high levels of impact and business or technical complexity.\n\n\u2022 Control system design practice within an enterprise or industry architecture.\n\n\u2022 Influence technology strategy and industry-based models for new technology applications.\n\n\u2022 Develop implementation and procurement strategies aligned to business needs.\n\n\u2022 Ensure adherence to relevant technical strategies, policies, standards and practices.\n\n\u2022 Champion modern engineering standards, cloud adoption and service lifecycle thinking across teams and programmes.\n\n\u2022 Define design principles that ensure cloud services remain resilient, observable, operable and maintainable throughout their lifecycle.\n\n\u2022 Influence design standards that optimise value, sustainability, reliability and cost efficiency.\n\n\u2022 Ensure cloud solutions are designed to deliver sustainable business and user outcomes.", "Leader": "", "Driver": ""}, "Systems integration": {"desc": "", "Learner": "\u2022 Talk about the process of integrating systems and the challenges of designing, building and testing interfaces between systems", "Contributor": "\u2022 Build and test simple interfaces between systems\n\n\u2022 Work on more complex integration as part of a wider team", "Skilled": "\u2022 Define the integration build\n\n\u2022 Co-ordinate build activities across systems\n\n\u2022 Understand how to undertake and support integration testing activities", "Expert": "\u2022 Establish standards and procedures across a service product life cycle, including the development product life cycle, and can ensure that practitioners adhere to these\n\n\u2022 Manage resources to ensure that the systems integration function works effectively", "Leader": "", "Driver": ""}, "Systems integration (Cloud)": {"desc": "", "Learner": "\u2022 Explain the purpose of systems integration and the challenges involved in designing, building and testing interfaces between systems.\n\n\u2022 Understand common cloud integration approaches and how integrated systems support end-to-end services.", "Contributor": "\u2022 Build and test simple interfaces between systems.\n\n\u2022 Contribute to more complex integration activities as part of a wider team.\n\n\u2022 Understand cloud integration patterns, APIs and messaging approaches.\n\n\u2022 Consider operational support and service continuity when developing integrations.", "Skilled": "\u2022 Define integration builds and coordinate integration activities across multiple systems.\n\n\u2022 Support and lead integration testing activities.\n\n\u2022 Apply integration standards, patterns and governance across cloud and hybrid environments.\n\n\u2022 Ensure integrated solutions meet service, operational and business requirements.\n\n\u2022 Ensure integrations include appropriate monitoring, resilience and recovery mechanisms.", "Expert": "\u2022 Establish standards and procedures across the service and product lifecycle, including development lifecycle activities.\n\n\u2022 Ensure practitioners adhere to integration standards and practices.\n\n\u2022 Manage resources to ensure the systems integration function operates effectively.\n\n\u2022 Define enterprise integration strategies and cloud interoperability approaches.\n\n\u2022 Define integration approaches that support reliable, observable and maintainable services.\n\n\u2022 Ensure integrated services remain resilient, supportable and aligned with business and user outcomes throughout their lifecycle.", "Leader": "", "Driver": ""}, "Team collaboration and wellbeing": {"desc": "", "Learner": "\u2022 You use agile principals to bring the team together on a regular basis. You ensure equality within team meetings and can identify when things are tense or need addressing.\n\n\u2022 You're comfortable facilitating conversations and can sense when someone is overstretched.\n\n\u2022 You work with a project lead to create effective working conditions for your team.", "Contributor": "\u2022 You are starting to get comfortable pulling together various skillsets within a team to collaborate.\n\n\u2022 You can sense when someone is overstretched and help them manage their workload.\n\n\u2022 You are beginning to lead on creating effective working conditions for your team with the support of a project lead.", "Skilled": "\u2022 You're comfortable creating the shape for an effective multidisciplinary team.\n\n\u2022 You're able to gently push and encourage team members to reach their own personal objectives. You are comfortable facilitating difficult conversations at a team level.\n\n\u2022 You are sometimes involved in the TPXimpact processes to bring together a multidisciplinary team.", "Expert": "\u2022 You are an expert in team collaboration and wellbeing, with the ability to bring people together to form motivated, effective teams.\n\n\u2022 You create the right environment for a team to work in and empower them to deliver while recognising and dealing with issues within the team.\n\n\u2022 You facilitate and mediate tough conversations within a project team, facilitating the best team make-up depending on the situation.", "Leader": "\u2022 You create and bring together effective multidiscplinary teams, ensuring that the right skillsets are present throughout the lifecycle of a project.\n\n\u2022 You are very comfortable facilitating difficult conversations within a team and elsewhere in TPXimpact or a client organisation.\n\n\u2022 You understand the processes within TPXimpact to bring together a team, working closely with the Operations and Resourcing teams to source appropriate permanent staff and contractors.", "Driver": "\u2022 You work across the entire delivery team to encourage collaboration. This could be on discreet internal projects, work taken on within delivery pods, or work done with other practices. \n\n\u2022 You are seen as the go-to person to facilitate difficult conversations within the organisation by people outside of the delivery team. This could mean facilitating difficult conversations with clients, managing performance, or mediating interpersonal issues.\n\n\u2022 You work to shape TPX's approachs and processes to facilitate collaboration and wellbeing within the delivery team. This can mean challenging existing processes and approaches when they are not effectively serving the team, or relaying challenging information to the team. This can also mean working with other teams to ensure safety and collaboration within project teams. \n\n\u2022 You are often responsible for making decisions around resourcing and wellbeing. This can involve removing someone from a project due to wellbeing or performance issues, while also ensuring a minimal impact on the remaining team."}, "Technical breadth (testing)": {"desc": "", "Learner": "\u2022 Show an awareness of a range of tools, libraries, and techniques for test automation\n\n\u2022 Demonstrate some technical attributes\n\n\u2022 Understand the core purpose of lightweight Utility Scripting (e.g., bash or PowerShell commands) to automate repetitive or manual test support tasks", "Contributor": "\u2022 Use a range of technologies for testing\n\n\u2022 Use one type of tool to Automated Test Code within an existing framework\n\n\u2022 Use technologies to design and execute test cases under guidance\n\n\u2022 Create or modify simple Utility Scripts to supplement or augment the test tech stack within the team", "Skilled": "\u2022 Demonstrate a good working knowledge of different tools and techniques, and can train others\n\n\u2022 Advise others on testing techniques and frameworks\n\n\u2022 Effectively research, plan and train others within the team\n\n\u2022 Independently write robust, standalone Utility Scripts (e.g., Python, Bash, PowerShell) to integrate within the codebase/tech stack to significantly enhance test effectiveness", "Expert": "\u2022 Act as an adviser with a strategic understanding of IT trends and technologies\n\n\u2022 Write and publish papers\n\n\u2022 Demonstrate knowledge of emerging tools and techniques\n\n\u2022 Set up frameworks based on the needs of the team\n\n\u2022 Effectively work across completely different engineering environments and scripting languages to build complex, reusable CLI tools or automation utilities used across multiple squads", "Leader": "", "Driver": ""}, "Technical specialism": {"desc": "", "Learner": "\u2022 Assist in technical support activities and carry out agreed or routine maintenance and administration tasks", "Contributor": "\u2022 Use management system software and tools\n\n\u2022 Use logical schemata to investigate problems, collect performance statistics and create reports\n\n\u2022 Carry out the routine configuration, installation and reconfiguration of database and related products\n\n\u2022 Optimise performance and forecast resource needs", "Skilled": "\u2022 Draft and maintain procedures and documentation\n\n\u2022 Set standards for the definition, security and integrity of objects, and ensure conformity to these standards", "Expert": "\u2022 Understand the direction of future technologies\n\n\u2022 Deliver a model to support and maintain those future technologies and any databases that coexist in the current environment", "Leader": "", "Driver": ""}, "Test analysis": {"desc": "", "Learner": "\u2022 Contribute to improving delivery and understand the importance of evidence-based design and analysis", "Contributor": "\u2022 Identify simple patterns and trends\n\n\u2022 Investigate problems and opportunities in existing processes, and contribute to recommending solutions\n\n\u2022 Work with stakeholders to identify objectives and potential benefits", "Skilled": "\u2022 Think creatively, ask the right questions and critically evaluate and communicate findings to a larger team\n\n\u2022 Lead investigative work into problems and opportunities in existing processes\n\n\u2022 Drive the collection of information and the creation of recommendations for improvements\n\n\u2022 Absorb large amounts of conflicting information and use it to determine solutions", "Expert": "\u2022 Think creatively, ask the right questions and critically evaluate and communicate findings to a larger team\n\n\u2022 Lead investigative work into problems and opportunities in existing processes\n\n\u2022 Drive the collection of information and the creation of recommendations for improvements\n\n\u2022 Absorb large amounts of conflicting information and use it to determine solutions", "Leader": "", "Driver": ""}, "Testing (data)": {"desc": "", "Learner": "\u2022 Correctly execute test scripts under supervision\n\n\u2022 Understand the role of testing and how it works", "Contributor": "\u2022 Review requirements and specifications, and define unit testing conditions for simple data products\n\n\u2022 Identify issues and risks associated with simple data products\n\n\u2022 Analyse and report unit test activities and results for simple data products", "Skilled": "\u2022 Review requirements and specifications, and define system testing conditions for complex data products\n\n\u2022 Identify issues and risks associated with complex data products\n\n\u2022 Analyse and report system test activities and results for complex data products", "Expert": "\u2022 Review requirements and specifications, and define system integration testing conditions for complex data products and support others to do the same\n\n\u2022 Identify issues and risks associated with complex data products and support others to do the same\n\n\u2022 Analyse and report system test activities and results for complex data products and support others to do the same", "Leader": "", "Driver": ""}, "Troubleshooting and problem resolution": {"desc": "", "Learner": "\u2022 Show an awareness of different technology capabilities\n\n\u2022 Demonstrate basic troubleshooting capability", "Contributor": "\u2022 Troubleshoot and identify problems across different technology capabilities", "Skilled": "\u2022 Break a problem down into its component parts to identify and diagnose root causes\n\n\u2022 Troubleshoot and identify problems across different technology capabilities", "Expert": "\u2022 Use lateral thinking to break a problem down into its component parts to identify and diagnose root causes\n\n\u2022 Troubleshoot and identify problems across different technology capabilities including computing, storage, networking, physical infrastructure, software, commercial-off-the-shelf software (COTS) and open source software", "Leader": "", "Driver": ""}, "User-centred service integration and systems thinking": {"desc": "", "Learner": "\u2022 You show an awareness of adjacent digital disciplines, such as user research, service design, and engineering. Under supervision, you can support the mapping of basic user steps to immediate backend operational tasks.", "Contributor": "\u2022 You understand how business analysis outputs feed into user journeys and service blueprints. You can collaborate with designers to assist in mapping internal, front-to-back operational processes to external user touchpoints.", "Skilled": "\u2022 You actively collaborate across disciplines to translate user research insights into viable business and technical processes. You contribute to complex service blueprints, ensuring a healthy balance between ideal user experiences, technical constraints, and organisational capabilities.", "Expert": "\u2022 You bridge the gap between delivery teams, user-centred design (UCD) specialists, and legacy business operations across a programme. You advise on the trade-offs between user experience and operational feasibility, ensuring that tech architecture and policy intent align to support the user journey.", "Leader": "\u2022 You set the standards for how business analysis integrates with UCD and agile delivery frameworks across the organisation. You foster a T-shaped culture, coaching BAs to think holistically about cross-functional ecosystems and architecting end-to-end service strategies that unite business, technology, and design.", "Driver": "\u2022 You hold strategic accountability for breaking down functional and technical silos across the department's portfolio. You influence high-level governance, funding models, and organisational structures to ensure that business analysis, design, and technology capabilities operate as a unified, outcome-driven ecosystem."}, "User focus": {"desc": "", "Learner": "\u2022 Show an awareness or understanding of user experience analysis and its principles\n\n\u2022 Explain the purpose of user stories and the focus on user needs", "Contributor": "\u2022 Identify and engage with users or stakeholders to collate user needs evidence\n\n\u2022 Understand and define research that fits user needs\n\n\u2022 Use quantitative and qualitative data about users to turn user focus into outcomes", "Skilled": "\u2022 Collaborate with user researchers and can represent users internally\n\n\u2022 Explain the difference between user needs and the desires of the user\n\n\u2022 Champion user research to focus on all users\n\n\u2022 Prioritise and define approaches to understand the user story, guiding others in doing so\n\n\u2022 Offer recommendations on the best tools and methods to use", "Expert": "\u2022 Give direction on which tools or methods to use\n\n\u2022 Demonstrate experience in meeting the needs of users across a variety of channels\n\n\u2022 Bring insight and expertise in how user needs have changed over time to ensure they're met by the business\n\n\u2022 Apply strategic thinking to provide the best service for the end user", "Leader": "", "Driver": ""}, "User focus (Cloud)": {"desc": "", "Learner": "\u2022 Demonstrate an understanding of users, their needs and how they interact with products and services.\n\n\u2022 Show an awareness of different products and services and how users consume them.\n\n\u2022 Gather and communicate user requirements under guidance.", "Contributor": "\u2022 Take inputs from users and stakeholders and establish coherent service frameworks that meet user needs.\n\n\u2022 Apply user-centred thinking when contributing to solutions and improvements.\n\n\u2022 Understand how user requirements influence service delivery and business outcomes.", "Skilled": "\u2022 Advocate for user needs throughout the delivery lifecycle.\n\n\u2022 See the bigger picture by considering groups of services and identifying how underlying services can best support user outcomes.\n\n\u2022 Balance user requirements with technical, operational and business constraints.\n\n\u2022 Use insight and feedback to drive continuous improvement of products and services.", "Expert": "\u2022 Shape organisational approaches to user-centred design and service delivery.\n\n\u2022 Understand and communicate service benefits to end users and stakeholders.\n\n\u2022 Apply strategic thinking to ensure services continue to deliver value throughout their lifecycle.\n\n\u2022 Influence investment, prioritisation and delivery decisions to maximise user and business outcomes.", "Leader": "", "Driver": ""}, "Working within constraints": {"desc": "", "Learner": "\u2022 You understand that policy, legislative, and operational constraints exist and follow established team guidelines to work within them under supervision.", "Contributor": "\u2022 You recognise the value of regulatory and operational constraints and can find the simplest, shortest, and fastest solution for users within those fixed boundaries.", "Skilled": "\u2022 You navigate standard project, policy, and legislative constraints independently. You identify potential friction points between user needs and operational constraints, proposing standard mitigations to the team.", "Expert": "\u2022 You identify, communicate, and work effectively within complex constraints. You know how and when to challenge the validity of constraints and ensure that all service standards are being rigorously met.", "Leader": "\u2022 You work with and challenge senior stakeholders to prioritise, mitigate, and turn constraints into a strategic advantage. You dynamically adapt the product approach depending on the shifting constraint landscape.", "Driver": "\u2022 You influence, challenge, and coach at the highest organisational levels. You anticipate how macro-level political or legislative constraints might change and act proactively to remove systemic barriers to delivery across the client organisation."}, "Value release and optimisation": {"desc": "", "Learner": "\u2022 You understand that products exist to deliver value to users and the organisation. You show an awareness of why releasing small changes early provides rapid feedback and support the team in tracking daily delivery tasks under direction.", "Contributor": "\u2022 You understand the concept of a Minimum Viable Product (MVP). You can assist the team in breaking down larger features into smaller, functional increments that allow the team to release value to users progressively rather than waiting for a single large-scale launch.", "Skilled": "\u2022 You independently structure your product roadmap and backlog to ensure the continuous release of high-value capabilities. You prioritise items based on their potential to unlock early benefits, and you use post-release data to verify that the value was successfully realised by users.", "Expert": "\u2022 You lead complex value-release strategies across a multi-faceted product or suite of features. You actively identify and remove operational, legal, or technical dependencies that delay value delivery, balancing short-term value drops with long-term product sustainability.", "Leader": "\u2022 You foster a culture of continuous value release across a major service area or mission. You define the iterative governance frameworks and funding models needed to support fast, incremental delivery, coaching other Product Managers on how to unlock trapped value within legacy architectures.", "Driver": "\u2022 You hold ultimate accountability for the systemic flow and acceleration of value across the department's entire digital portfolio. You influence cross-governmental funding, procurement, and policy frameworks to shift the organisation away from \"big bang\" delivery models toward continuous, high-impact value release for the client."}}, "behaviours": [{"name": "Developing your craft", "def": "How you learn, develop, and grow the capability of those around you. Covers self-awareness, seeking and applying feedback, and knowledge sharing.", "levels": {"6: Graduate": "\u2022 You are aware of the areas of your practice you are capable in, and those where you need to build further capability.\n\n\u2022 You seek specific feedback close to the activity, asking 'what did I do well in this' and 'what can I improve'.\n\n\u2022 You focus on developing the core skills needed to deliver your craft, applying feedback to adjust your approach on live work.", "7: Junior": "\u2022 You are aware of the areas of your practice you are capable in, and those where you need to build further capability.\n\n\u2022 You seek specific feedback close to the activity, asking 'what did I do well in this' and 'what can I improve'.\n\n\u2022 You focus on developing the core skills needed to deliver your craft, applying feedback to adjust your approach on live work.", "8: Mid": "\u2022 You identify appropriate sources of guidance to inform your development needs and pursue opportunities to build your skills and experience.\n\n\u2022 You seek targeted feedback from those around you to develop your craft, and make use of the learning opportunities available to you.\n\n\u2022 You contribute to knowledge sharing by passing on what you have learnt from your work so others can benefit from it.\n\n\u2022 You learn new skills needed for upcoming projects and proactively discuss these with your line manager or project lead.", "9: Senior": "\u2022 You take ownership for your own development, seeking targeted feedback and input from others to sharpen your craft.\n\n\u2022 You have a clear view of your gaps and actively learn from colleagues with strengths in those areas.\n\n\u2022 You make your learnings and craft visible to others, sharing your work and your thinking openly so colleagues know where to bring you in.\n\n\u2022 You deepen the knowledge of others by promoting good practice and sharing the latest thinking with others in your practice area.", "10: Lead": "\u2022 You take ownership for your development, contribute towards the development of others, and actively learn from more senior colleagues to address your own gaps.\n\n\u2022 You understand how your working style influences those around you and demonstrate the learning behaviours you expect in others, taking on feedback from less senior colleagues.\n\n\u2022 You demonstrate good practice in your area through how you create approaches that others can follow and bring new ideas into your work to keep the practice current.\n\n\u2022 You
